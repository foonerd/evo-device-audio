[package]
name = "evo-apply-update"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Root helper for the distribution's in-app updater: a closed-grammar request wrapper and the worker a transient systemd unit runs. Verifies signed registry and host-files documents, then installs verified plugin bundles and host files."
publish = false

[lib]
path = "src/lib.rs"

# The sudo target. Parses a closed grammar and starts one transient
# unit instance; does no other work.
[[bin]]
name = "evo-apply-update"
path = "src/bin/evo-apply-update.rs"

# The unit's process. Not in any sudoers grant.
[[bin]]
name = "evo-apply-update-worker"
path = "src/bin/evo-apply-update-worker.rs"

[dependencies]
ed25519-dalek = { workspace = true }
base64 = { workspace = true }
flate2 = { workspace = true }
hex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tar = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
