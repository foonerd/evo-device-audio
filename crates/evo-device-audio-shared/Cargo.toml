[package]
name = "evo-device-audio-shared"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared utilities for the evo-device-audio brand-neutral plugin crates: local-library tag scanning and mpd-album value parsing. Workspace-internal; not a published artefact."
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
evo-plugin-sdk = { workspace = true }
lofty = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Artwork transcode pipeline: image decode + Lanczos3 resize +
# WebP encode + SHA-256 content_hash. Shared so every artwork
# provider plugin (local + online + future siblings) consumes
# one production-validated primitive — single truth path for
# size taxonomy, encoder quality, content_hash shape.
thiserror = { workspace = true }
image = { workspace = true }
webp = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
# tracing is already a workspace dep used by everything
# downstream; declare here so the shared crate can log
# resize / encode outcomes consistently.
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
