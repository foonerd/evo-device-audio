[package]
name = "evo-audio-topology"
version = "0.1.13"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
description = "Audio topology, routing, operator policy and chain scoring for the evo audio distribution."

[dependencies]
evo = { workspace = true }
evo-plugin-sdk = { workspace = true }
evo-primitives = { workspace = true }
async-trait = "0.1"
arc-swap = "1.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { workspace = true }
tracing = { workspace = true }
