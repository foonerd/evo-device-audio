[package]
name = "evo-airplay"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0 AND MIT"
repository.workspace = true
description = "AirPlay 2 audio receiver library (network in, PCM and events out), derived from the MIT-licensed openairplay2 0.5.0. Buffered audio only."
readme = "NOTICE.md"

[dependencies]
base64 = { workspace = true }
chacha20poly1305 = { workspace = true }
ed25519-dalek = { workspace = true, features = ["rand_core"] }
hex = { workspace = true }
hkdf = "0.12"
num-bigint = "0.4"
plist = "1"
rand = "0.8"
sha2 = { workspace = true }
symphonia = { version = "0.5", default-features = false, features = ["aac"] }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { version = "1", features = ["v4"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }

[lints]
workspace = true
