[workspace]
resolver = "2"
members = [
    "crates/evo-device-audio-shared",
    "crates/evo-device-audio-distribution",
    "crates/evo-multiroom",
    "crates/evo-online-providers",
    "crates/evo-parity-harness",
    "plugins/org.evoframework.playback.mpd",
    "plugins/org.evoframework.metadata.local",
    "plugins/org.evoframework.artwork.local",
    "plugins/org.evoframework.artwork.online",
    "plugins/org.evoframework.metadata.online",
    "plugins/org.evoframework.composition.alsa",
    "plugins/org.evoframework.delivery.alsa",
    "plugins/org.evoframework.playback.options",
    "plugins/org.evoframework.network",
    "plugins/org.evoframework.multiroom.evo-native",
    "plugins/org.evoframework.hardware.audio-config",
    "plugins/org.evoframework.system.power",
    "plugins/org.evoframework.audio.terminus",
    "plugins/org.evoframework.network.shares",
    "plugins/org.evoframework.network.smb-server",
    "plugins/org.evoframework.system.notifications",
]

# Each plugin crate lives under plugins/<full.dotted.name>/ matching
# its manifest plugin name. New plugins are added to the members
# array in the same commit that introduces them. Workspace-internal
# shared utilities live under crates/.

[workspace.package]
version = "0.1.0"
edition = "2021"
# Match evo-core MSRV (see foonerd/evo-core docs/engineering/MSRV.md).
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/foonerd/evo-device-audio"

# Single pin for the evo framework. Every plugin crate consumes the
# SDK via `evo-plugin-sdk = { workspace = true }` so there is exactly
# one place to bump the version. Pin is intentional; do not track
# evo-core main silently. Upgrade procedure is in DEVELOPING.md.
#
# Non-framework dependencies are pinned here too so plugin crates
# cannot drift independently. Feature sets are the superset needed
# across the plugin population; individual crates pay only for what
# they actually import.
#
# During pre-release development the SDK pin resolves via a sibling
# path-dep on the framework's working tree (the SDK substrate this
# branch reshapes plugins against — typed audio data plane,
# AudioRouting trait, CompositionCapabilities at shape 2 — ships
# unreleased on that branch). At release cut the pin flips back to
# `git = "...evo-core.git", tag = "..."` against the matching
# published framework tag before the branch merges to main.
[workspace.dependencies]
evo-plugin-sdk = { path = "../evo-core-eng/crates/evo-plugin-sdk" }
evo-device-audio-shared = { path = "crates/evo-device-audio-shared", version = "0.1.0" }
semver = { version = "1", features = ["serde"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "io-util", "sync"] }
tracing = "0.1"
thiserror = "1"
anyhow = "1"
lofty = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
toml = "0.8"
base64 = "0.22"
chacha20poly1305 = "0.10"
getrandom = "0.3"
sha2 = "0.10"
ed25519-dalek = "2"
regex = "1"
hex = "0.4"
# image: image decoding + resize (Lanczos3) for the artwork
# pipeline. default-features off + explicit format gates keeps
# the dep surface tight (jpeg + png for decode; lossless WebP
# decode/encode via image-webp; ico/tiff/bmp/etc disabled).
# Cross-build to aarch64 / armv7 stays clean — no platform-
# specific encoder pulls.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "rayon"] }
# webp: libwebp bindings for LOSSY WebP encoding at quality 82
# (Roon-class default). image-webp v0.2 only exposes lossless
# encoding which paradoxically inflates thumbnail bytes vs
# JPEG; this crate's libwebp-sys backend ships the canonical
# lossy encoder the catalogue acceptance row pins against.
# default-features off retires the optional image-crate
# convenience helper which would pull in a parallel image-crate
# version axis; we encode from raw rgba8 buffers directly.
webp = { version = "0.3", default-features = false }

# Mirrors evo-core's workspace lints. No unsafe; all public items
# documented.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

# The SDK trait contract uses
#   fn foo() -> impl Future<Output = T> + Send + '_
# rather than `async fn foo() -> T` because trait-position async fn
# does not carry Send bounds on the returned future, which breaks
# the steward's tokio multi-threaded dispatch. Clippy's
# manual_async_fn suggests an incompatible rewrite; allow at
# workspace level.
[workspace.lints.clippy]
manual_async_fn = "allow"
