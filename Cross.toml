# cross (https://github.com/cross-rs/cross) configuration for
# evo-device-audio.
#
# ## Base image: debian:trixie
#
# All three per-target images pin `FROM debian:trixie` — the
# same OS + package universe the target devices run — so build-
# time and runtime dynamic-linker see the SAME symbol version
# and vendor patch level. Cross-rs's default
# `ghcr.io/cross-rs/*:main` images resolve to Ubuntu 20.04
# focal; libasound2's mature ABI happens to be safe across
# Ubuntu-vendored vs Debian-runtime, but the discipline break
# is real and other ABIs (GTK4 / WebKit6 in evo-kiosk-eng) are
# not safe under the same mismatch. We pick discipline over
# luck: build environment matches runtime environment exactly.
# See `cross-images/x86_64-unknown-linux-gnu/Dockerfile` for
# the base pinning + package list.
#
# ## Path-dep workspace-root visibility
#
# During pre-release development the workspace's
# `evo-plugin-sdk` pin resolves through a sibling path-dep on
# the framework's working tree. `cross-rs` auto-mounts each
# path-dep crate directory into the container at the host-
# canonical path but does NOT mount the path-dep's workspace
# root. The SDK pin uses `edition.workspace = true`, so cargo
# must walk up from the SDK crate to its workspace root to
# resolve the inheritance. `scripts/cross-build.sh` supplies
# the missing volume mount via CROSS_CONTAINER_OPTS. At release
# cut the SDK pin flips back to `git = ..., tag = ...` and the
# workaround retires.
#
# The `volumes = ["EVO_CORE_ENG"]` entry declares that the
# EVO_CORE_ENG environment variable holds a host path to bind-
# mount into the container. `scripts/cross-build.sh` sets it
# to the resolved evo-core-eng directory before invoking
# `cross build`.

[build.env]
volumes = ["EVO_CORE_ENG"]

[target.x86_64-unknown-linux-gnu]
dockerfile.file = "cross-images/x86_64-unknown-linux-gnu/Dockerfile"

[target.x86_64-unknown-linux-gnu.env]
volumes = ["EVO_CORE_ENG"]

[target.aarch64-unknown-linux-gnu]
dockerfile.file = "cross-images/aarch64-unknown-linux-gnu/Dockerfile"

[target.aarch64-unknown-linux-gnu.env]
volumes = ["EVO_CORE_ENG"]

[target.armv7-unknown-linux-gnueabihf]
dockerfile.file = "cross-images/armv7-unknown-linux-gnueabihf/Dockerfile"

[target.armv7-unknown-linux-gnueabihf.env]
volumes = ["EVO_CORE_ENG"]
