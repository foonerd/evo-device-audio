# cut(V) — public pieces → wait → bake → channel promote.
#
# Through-and-through = pieces + bake + channel pointers on
# artefacts. Bake alone is not a cut (2026-11-22 FAIL).
# Latest stays untouched unless mark_latest=true (owner accept).
#
# Mints use EVO_RELEASE_TOKEN (Actions: write on evo-device-audio +
# evo-ui). Artefacts push stays on ARTEFACTS_PUSH_TOKEN. Same-repo
# bake uses github.token. No workstation mint path.
name: cut

"on":
  workflow_dispatch:
    inputs:
      tag:
        description: "Public cut tag (vMAJOR.MINOR.PATCH.CUT)"
        type: string
        required: true
      channel:
        description: "Channel that must point at this cut when cut.yml finishes"
        type: choice
        options: [dev, test, prod]
        default: test
      mark_latest:
        description: "Mark artefacts Release as GitHub Latest (installer default). Owner accept only."
        type: boolean
        default: false

concurrency:
  group: cut-${{ inputs.tag }}
  cancel-in-progress: false

env:
  COMMIT_USER: evo-device-audio CI
  COMMIT_EMAIL: ci@evoframework.org
  ARTEFACTS_REPO: foonerd/evo-device-audio-artefacts

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.cut.outputs.tag }}
      cut_v: ${{ steps.cut.outputs.cut_v }}
    steps:
      - name: Accept tag only
        id: cut
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="$TAG"
          case "$tag" in
            v*) ;;
            *) tag="v${tag}" ;;
          esac
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::cut(V): tag must be vMAJOR.MINOR.PATCH.CUT (got '${TAG}')"
            exit 1
          fi
          cut_v="${tag#v}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "cut_v=${cut_v}" >> "$GITHUB_OUTPUT"
          echo "cut(${cut_v}) public tag ${tag}"

      - name: Require public sibling tags
        env:
          TAG: ${{ steps.cut.outputs.tag }}
          GH_TOKEN: ${{ secrets.EVO_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::EVO_RELEASE_TOKEN is empty"
            exit 1
          fi
          for repo in foonerd/evo-device-audio foonerd/evo-ui foonerd/evo-kiosk foonerd/evo-core; do
            if ! gh api "repos/${repo}/git/refs/tags/${TAG}" >/dev/null 2>&1; then
              echo "::error::public ${repo} has no tag ${TAG}; promote first"
              exit 1
            fi
            echo "OK public ${repo} tag ${TAG}"
          done

  mint-pieces:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Mint audio + kiosk + evo-ui pieces
        env:
          GH_TOKEN: ${{ secrets.EVO_RELEASE_TOKEN }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::EVO_RELEASE_TOKEN is empty — cannot workflow_dispatch"
            exit 1
          fi

          watch_new_run() {
            local repo="$1" workflow="$2" label="$3" before="$4"
            local run_id="" cand
            for _ in $(seq 1 45); do
              sleep 4
              cand="$(gh run list --repo "${repo}" --workflow="${workflow}" \
                --limit 1 --json databaseId --jq '.[0].databaseId')"
              if [ -n "${cand}" ] && [ "${cand}" != "${before}" ]; then
                run_id="${cand}"
                break
              fi
            done
            if [ -z "${run_id}" ]; then
              echo "::error::no ${label} run appeared"
              exit 1
            fi
            echo "watching ${label} run ${run_id}"
            gh run watch "${run_id}" --repo "${repo}" --exit-status
          }

          # refs/tags/ — same-named branch must not win
          tag_ref="refs/tags/${TAG}"
          before="$(gh run list --repo foonerd/evo-device-audio \
            --workflow=publish-pieces.yml --limit 1 \
            --json databaseId --jq '.[0].databaseId // empty')"
          gh workflow run publish-pieces.yml \
            --repo foonerd/evo-device-audio --ref "${tag_ref}" -f scope=all
          watch_new_run foonerd/evo-device-audio publish-pieces.yml \
            "audio pieces all" "${before}"

          before="$(gh run list --repo foonerd/evo-device-audio \
            --workflow=publish-pieces.yml --limit 1 \
            --json databaseId --jq '.[0].databaseId // empty')"
          gh workflow run publish-pieces.yml \
            --repo foonerd/evo-device-audio --ref "${tag_ref}" \
            -f scope=kiosk -f "kiosk_ref=${tag_ref}"
          watch_new_run foonerd/evo-device-audio publish-pieces.yml \
            "audio pieces kiosk" "${before}"

          before="$(gh run list --repo foonerd/evo-ui \
            --workflow=publish-pieces.yml --limit 1 \
            --json databaseId --jq '.[0].databaseId // empty')"
          gh workflow run publish-pieces.yml \
            --repo foonerd/evo-ui --ref "${tag_ref}" -f scope=all
          watch_new_run foonerd/evo-ui publish-pieces.yml \
            "evo-ui pieces" "${before}"

  wait-slots:
    needs: [validate, mint-pieces]
    runs-on: ubuntu-latest
    steps:
      - name: Check out audio at the cut tag
        uses: actions/checkout@v5
        with:
          # Prefer refs/tags/ — a same-named branch shadows the tag
          # and may lack wait-for-piece-slots.sh (v0.1.13.1 FAIL).
          ref: refs/tags/${{ needs.validate.outputs.tag }}
          fetch-depth: 0
          path: evo-device-audio

      - name: Check out artefacts
        env:
          TOKEN: ${{ secrets.ARTEFACTS_PUSH_TOKEN }}
        run: |
          set -euo pipefail
          git clone --filter=blob:none \
            "https://x-access-token:${TOKEN}@github.com/${ARTEFACTS_REPO}.git" \
            evo-device-audio-artefacts

      - name: Wait for every pin + plugin slot
        run: |
          set -euo pipefail
          chmod +x evo-device-audio/scripts/release/wait-for-piece-slots.sh
          bash evo-device-audio/scripts/release/wait-for-piece-slots.sh \
            --artefacts-repo "${GITHUB_WORKSPACE}/evo-device-audio-artefacts" \
            --timeout-sec 7200 \
            --poll-sec 30

  bake:
    needs: [validate, wait-slots]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Dispatch bake for the cut tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          before="$(gh run list --repo foonerd/evo-device-audio \
            --workflow=publish-distribution-bundle.yml \
            --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          gh workflow run publish-distribution-bundle.yml \
            --repo foonerd/evo-device-audio \
            --ref "refs/tags/${TAG}" \
            -f "tag=${TAG}"
          run_id=""
          for _ in $(seq 1 30); do
            sleep 4
            cand="$(gh run list --repo foonerd/evo-device-audio \
              --workflow=publish-distribution-bundle.yml \
              --limit 1 --json databaseId --jq '.[0].databaseId')"
            if [ -n "${cand}" ] && [ "${cand}" != "${before}" ]; then
              run_id="${cand}"
              break
            fi
          done
          if [ -z "${run_id}" ]; then
            echo "::error::no bake run"
            exit 1
          fi
          echo "watching bake run ${run_id}"
          gh run watch "${run_id}" --repo foonerd/evo-device-audio --exit-status
          echo "cut(${{ needs.validate.outputs.cut_v }}) bake PASS"

  promote-channel:
    needs: [validate, bake]
    runs-on: ubuntu-latest
    steps:
      - name: Point channel at this cut (steward + all OOP plugins)
        env:
          GH_TOKEN: ${{ secrets.EVO_RELEASE_TOKEN }}
          TAG: ${{ needs.validate.outputs.tag }}
          CUT_V: ${{ needs.validate.outputs.cut_v }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::EVO_RELEASE_TOKEN is empty — cannot promote channel"
            exit 1
          fi
          before="$(gh run list --repo foonerd/evo-device-audio \
            --workflow=promote.yml --limit 1 \
            --json databaseId --jq '.[0].databaseId // empty')"
          # Workflow YAML lives on main. The cut tag is product
          # bytes, not the promote definition.
          gh workflow run promote.yml \
            --repo foonerd/evo-device-audio \
            --ref main \
            -f piece=__cut__ \
            -f "version=${CUT_V}" \
            -f "channel=${CHANNEL}"
          run_id=""
          for _ in $(seq 1 45); do
            sleep 4
            cand="$(gh run list --repo foonerd/evo-device-audio \
              --workflow=promote.yml --limit 1 \
              --json databaseId --jq '.[0].databaseId')"
            if [ -n "${cand}" ] && [ "${cand}" != "${before}" ]; then
              run_id="${cand}"
              break
            fi
          done
          if [ -z "${run_id}" ]; then
            echo "::error::no promote run for channel ${CHANNEL}"
            exit 1
          fi
          echo "watching promote run ${run_id}"
          gh run watch "${run_id}" --repo foonerd/evo-device-audio --exit-status
          echo "cut(${CUT_V}) channel ${CHANNEL} PASS"

  mark-latest:
    needs: [validate, bake, promote-channel]
    if: ${{ inputs.mark_latest }}
    runs-on: ubuntu-latest
    steps:
      - name: Mark artefacts Release Latest
        env:
          GH_TOKEN: ${{ secrets.ARTEFACTS_PUSH_TOKEN }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::ARTEFACTS_PUSH_TOKEN is empty"
            exit 1
          fi
          gh release edit "${TAG}" \
            --repo foonerd/evo-device-audio-artefacts \
            --latest
          echo "Latest -> ${TAG}"

  cut-complete:
    needs: [validate, bake, promote-channel, mark-latest]
    if: ${{ always() && needs.bake.result == 'success' && needs.promote-channel.result == 'success' && (needs.mark-latest.result == 'success' || needs.mark-latest.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - name: Through-and-through
        env:
          CUT_V: ${{ needs.validate.outputs.cut_v }}
          CHANNEL: ${{ inputs.channel }}
          MARK: ${{ inputs.mark_latest }}
        run: |
          set -euo pipefail
          echo "cut(${CUT_V}) through-and-through PASS"
          echo "channel=${CHANNEL}"
          echo "mark_latest=${MARK}"

