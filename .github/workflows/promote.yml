# Promote: move a channel pointer to a cut of a piece that is already
# published on the plane, for every triple the plane ships. For an
# org.evoframework.* plugin that is
# bundles/<plugin>/<triple>/<plugin>-<cut>-<triple>.tar.gz; for
# evo-device-audio it is binaries/evo-device-audio/<cut>/<triple>/
# evo-device-audio. No rebuild; no signing of the piece itself. The
# channel-pointer file is signed with the commons key so consumers
# can verify which cut a channel points at.
#
# Format is v0. When the framework ships its release-plane contract
# in `evo-core/docs/engineering/RELEASE_PLANE.md`, the channel-
# pointer file shape will reshape to match; the migration is
# in-place.
name: promote

"on":
  workflow_dispatch:
    inputs:
      piece:
        description: "Piece name (e.g. org.evoframework.playback.mpd)"
        type: string
        required: true
      version:
        description: "Cut already published on the plane for every triple (bundles/ for a plugin, binaries/ for evo-device-audio), e.g. 0.1.13.0"
        type: string
        required: true
      channel:
        description: "Target channel"
        type: choice
        options: [dev, test, prod]
        required: true

env:
  ARTEFACTS_REPO: foonerd/evo-device-audio-artefacts
  COMMIT_USER: evo-device-audio CI
  COMMIT_EMAIL: ci@evoframework.org

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Promote channel pointer
        env:
          PLUGIN_SIGNING_KEY_PEM: ${{ secrets.PLUGIN_SIGNING_KEY_PEM }}
          GH_TOKEN: ${{ secrets.ARTEFACTS_PUSH_TOKEN }}
          PIECE: ${{ inputs.piece }}
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -e
          if [ -z "$PLUGIN_SIGNING_KEY_PEM" ]; then
            echo "::error::PLUGIN_SIGNING_KEY_PEM is empty or unset"
            exit 1
          fi
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::ARTEFACTS_PUSH_TOKEN is empty or unset"
            exit 1
          fi
          umask 077
          printenv PLUGIN_SIGNING_KEY_PEM > /tmp/key.pem

          git config --global user.name "${COMMIT_USER}"
          git config --global user.email "${COMMIT_EMAIL}"

          ART=/tmp/artefacts
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${ARTEFACTS_REPO}.git" "$ART"
          cd "$ART"

          # The cut must be on the plane for every triple it ships. A
          # cut is digits and dots and a plugin name has the
          # org.evoframework.* shape, so neither can walk the path to
          # a different file.
          TRIPLES="aarch64-unknown-linux-gnu x86_64-unknown-linux-gnu armv7-unknown-linux-gnueabihf"
          if ! printf '%s' "$VERSION" | grep -Eqx '[0-9]+(\.[0-9]+)*'; then
            echo "::error::'${VERSION}' is not a cut (digits and dots)"
            exit 1
          fi
          if [ "$PIECE" != "evo-device-audio" ] \
              && ! printf '%s' "$PIECE" | grep -Eqx 'org\.evoframework(\.[a-z0-9]+(-[a-z0-9]+)*)+'; then
            echo "::error::${PIECE} is neither an org.evoframework.* plugin nor evo-device-audio; there is nothing on the plane to prove it against"
            exit 1
          fi
          missing=0
          for TRIPLE in $TRIPLES; do
            if [ "$PIECE" = "evo-device-audio" ]; then
              FILE="binaries/evo-device-audio/${VERSION}/${TRIPLE}/evo-device-audio"
            else
              FILE="bundles/${PIECE}/${TRIPLE}/${PIECE}-${VERSION}-${TRIPLE}.tar.gz"
            fi
            if [ ! -f "$FILE" ]; then
              echo "::error::${FILE} not found in ${ARTEFACTS_REPO}; cannot promote a cut that has not been published"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          mkdir -p channels
          CFILE="channels/${CHANNEL}.toml"
          UPDATED_AT=$(date -u +%FT%TZ)

          python3 "$GITHUB_WORKSPACE/.github/workflows/promote_channel_pointer.py" \
              "$CFILE" "$PIECE" "$VERSION" "$CHANNEL" "$UPDATED_AT"

          openssl pkeyutl -sign \
              -inkey /tmp/key.pem -rawin \
              -in "$CFILE" \
              -out "${CFILE%.toml}.sig"

          shred -u /tmp/key.pem

          git add channels/
          MSG="promote: ${PIECE} ${VERSION} -> ${CHANNEL}"
          git commit -m "$MSG"
          git push origin main
          echo "Promoted: $MSG"
