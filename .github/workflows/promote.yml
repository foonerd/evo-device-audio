# Promote: move a channel pointer to a piece version that is
# already published. No rebuild; no re-sign of the piece.
# The channel-pointer file is signed with the commons key so
# consumers can verify which version a channel points at.
#
# Piece is either:
#   evo-device-audio
#     -> binaries/evo-device-audio/<version>/ must exist
#   org.evoframework.<plugin>
#     -> bundles/<plugin>/<target>/<plugin>-<version>-<target>.tar.gz
#
# Manifest-only stubs under pieces/ do not count. Rollback is
# the same pointer move, back to a version that is still on disk.
name: promote

"on":
  workflow_dispatch:
    inputs:
      piece:
        description: "Piece name (evo-device-audio, evo-ui-shell, evo-ui-runtime, evo-kiosk, evo-device-boot, evo-device-audio-dist, or a plugin)"
        type: string
        required: true
      version:
        description: "Version already published for that piece"
        type: string
        required: true
      channel:
        description: "Target channel"
        type: choice
        options: [dev, test, prod]
        required: true

env:
  ARTEFACTS_REPO: foonerd/evo-device-audio-artefacts
  COMMIT_USER: evo-device-audio CI
  COMMIT_EMAIL: ci@evoframework.org
  STEWARD_PIECE: evo-device-audio

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Promote channel pointer
        env:
          PLUGIN_SIGNING_KEY_PEM: ${{ secrets.PLUGIN_SIGNING_KEY_PEM }}
          GH_TOKEN: ${{ secrets.ARTEFACTS_PUSH_TOKEN }}
          PIECE: ${{ inputs.piece }}
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          if [ -z "$PLUGIN_SIGNING_KEY_PEM" ]; then
            echo "::error::PLUGIN_SIGNING_KEY_PEM is empty or unset"
            exit 1
          fi
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::ARTEFACTS_PUSH_TOKEN is empty or unset"
            exit 1
          fi
          if [ -z "$VERSION" ]; then
            echo "::error::version is empty"
            exit 1
          fi
          umask 077
          printenv PLUGIN_SIGNING_KEY_PEM > /tmp/key.pem

          git config --global user.name "${COMMIT_USER}"
          git config --global user.email "${COMMIT_EMAIL}"

          ART=/tmp/artefacts
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${ARTEFACTS_REPO}.git" "$ART"
          cd "$ART"

          if [ -d "binaries/${PIECE}/${VERSION}" ]; then
            echo "found binaries/${PIECE}/${VERSION}"
          elif [ -d "bundles/${PIECE}/${VERSION}" ]; then
            echo "found bundles/${PIECE}/${VERSION}"
          else
            shopt -s nullglob
            found=(bundles/"${PIECE}"/*/"${PIECE}-${VERSION}"-*.tar.gz)
            trees=(bundles/"${PIECE}"/"${VERSION}"/tree.tar.gz)
            if [ ${#found[@]} -eq 0 ] && [ ${#trees[@]} -eq 0 ]; then
              echo "::error::no published slot for ${PIECE} ${VERSION} (binaries/ or bundles/); mint the piece first"
              exit 1
            fi
          fi

          mkdir -p channels
          CFILE="channels/${CHANNEL}.toml"
          UPDATED_AT=$(date -u +%FT%TZ)

          python3 "$GITHUB_WORKSPACE/.github/workflows/promote_channel_pointer.py" \
              "$CFILE" "$PIECE" "$VERSION" "$CHANNEL" "$UPDATED_AT"

          openssl pkeyutl -sign \
              -inkey /tmp/key.pem -rawin \
              -in "$CFILE" \
              -out "${CFILE%.toml}.sig"

          shred -u /tmp/key.pem

          git add channels/
          MSG="promote: ${PIECE} ${VERSION} -> ${CHANNEL}"
          git commit -m "$MSG"
          git push origin main
          echo "Promoted: $MSG"
