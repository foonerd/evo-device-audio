# Promote: move a channel pointer to a piece version that is
# already published. No rebuild; no re-sign of the piece.
# The channel-pointer file is signed with the commons key so
# consumers can verify which version a channel points at.
#
# Piece is either:
#   evo-device-audio
#     -> binaries/evo-device-audio/<version>/ must exist
#   org.evoframework.<plugin>
#     -> bundles/<plugin>/<target>/<plugin>-<version>-<target>.tar.gz
#   __cut__
#     -> steward + every plugin in dist/scripts/lib/oop-plugins.sh
#        at <version>, one commit (no push races)
#
# Manifest-only stubs under pieces/ do not count. Rollback is
# the same pointer move, back to a version that is still on disk.
#
# Concurrency is per channel so two promotes cannot reject each
# other on artefacts main (2026-11-22 FAIL).
name: promote

"on":
  workflow_dispatch:
    inputs:
      piece:
        description: "Piece name, or __cut__ for steward+all OOP plugins at version"
        type: string
        required: true
      version:
        description: "Version already published for that piece"
        type: string
        required: true
      channel:
        description: "Target channel"
        type: choice
        options: [dev, test, prod]
        required: true

concurrency:
  group: promote-${{ inputs.channel }}
  cancel-in-progress: false

env:
  ARTEFACTS_REPO: foonerd/evo-device-audio-artefacts
  COMMIT_USER: evo-device-audio CI
  COMMIT_EMAIL: ci@evoframework.org
  STEWARD_PIECE: evo-device-audio

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Promote channel pointer
        env:
          PLUGIN_SIGNING_KEY_PEM: ${{ secrets.PLUGIN_SIGNING_KEY_PEM }}
          GH_TOKEN: ${{ secrets.ARTEFACTS_PUSH_TOKEN }}
          PIECE: ${{ inputs.piece }}
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          if [ -z "$PLUGIN_SIGNING_KEY_PEM" ]; then
            echo "::error::PLUGIN_SIGNING_KEY_PEM is empty or unset"
            exit 1
          fi
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::ARTEFACTS_PUSH_TOKEN is empty or unset"
            exit 1
          fi
          if [ -z "$VERSION" ]; then
            echo "::error::version is empty"
            exit 1
          fi
          umask 077
          printenv PLUGIN_SIGNING_KEY_PEM > /tmp/key.pem

          git config --global user.name "${COMMIT_USER}"
          git config --global user.email "${COMMIT_EMAIL}"

          ART=/tmp/artefacts
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${ARTEFACTS_REPO}.git" "$ART"
          cd "$ART"

          require_slot() {
            local piece="$1" version="$2"
            if [ -d "binaries/${piece}/${version}" ]; then
              echo "found binaries/${piece}/${version}"
              return 0
            fi
            if [ -d "bundles/${piece}/${version}" ]; then
              echo "found bundles/${piece}/${version}"
              return 0
            fi
            shopt -s nullglob
            local found=(bundles/"${piece}"/*/"${piece}-${version}"-*.tar.gz)
            local trees=(bundles/"${piece}"/"${version}"/tree.tar.gz)
            if [ ${#found[@]} -eq 0 ] && [ ${#trees[@]} -eq 0 ]; then
              echo "::error::no published slot for ${piece} ${version} (binaries/ or bundles/); mint the piece first"
              exit 1
            fi
            echo "found plugin bundle ${piece} ${version}"
          }

          PIECES=()
          if [ "$PIECE" = "__cut__" ]; then
            # shellcheck source=/dev/null
            source "$GITHUB_WORKSPACE/dist/scripts/lib/oop-plugins.sh"
            PIECES=("${STEWARD_PIECE}")
            for entry in "${OOP_PLUGINS[@]}"; do
              PIECES+=("${entry%%:*}")
            done
          else
            PIECES=("$PIECE")
          fi

          for p in "${PIECES[@]}"; do
            require_slot "$p" "$VERSION"
          done

          mkdir -p channels
          CFILE="channels/${CHANNEL}.toml"
          UPDATED_AT=$(date -u +%FT%TZ)

          for p in "${PIECES[@]}"; do
            python3 "$GITHUB_WORKSPACE/.github/workflows/promote_channel_pointer.py" \
                "$CFILE" "$p" "$VERSION" "$CHANNEL" "$UPDATED_AT"
          done

          openssl pkeyutl -sign \
              -inkey /tmp/key.pem -rawin \
              -in "$CFILE" \
              -out "${CFILE%.toml}.sig"

          shred -u /tmp/key.pem

          git add channels/
          if [ "$PIECE" = "__cut__" ]; then
            MSG="promote: cut ${VERSION} -> ${CHANNEL} (steward + OOP plugins)"
          else
            MSG="promote: ${PIECE} ${VERSION} -> ${CHANNEL}"
          fi
          git commit -m "$MSG"

          # Rebase+retry: parallel promotes used to reject on main
          # (2026-11-22 run 45056280643).
          pushed=0
          for attempt in 1 2 3 4 5 6 7 8; do
            if git push origin main; then
              pushed=1
              break
            fi
            echo "push rejected (attempt ${attempt}); rebase and retry"
            git pull --rebase origin main
            sleep $((attempt * 2))
          done
          if [ "$pushed" -ne 1 ]; then
            echo "::error::failed to push channel pointer after retries"
            exit 1
          fi
          echo "Promoted: $MSG"
