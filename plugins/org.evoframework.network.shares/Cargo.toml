[package]
name = "org-evoframework-network-shares"
# Keep in sync with manifest.toml [plugin].version and PluginIdentity in describe().
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Framework-reference network-shares plugin. Stocks the networking.shares shelf's share-management + discovery verb subset (network.share.add / edit / remove / mount / unmount / list_configured / get_state + network.discovery.refresh / list). Owns the persisted share record set, the CIFS dialect probe, NFS mount, LAN discovery via avahi-browse + smbclient, mount lifecycle (boot-mount + periodic remount + 5-min discovery cadence), and the reactive subjects the operator UI's shares surface consumes (system_network_shares_configured / system_network_shares_discovered / network_share_state)."

[lib]
path = "src/lib.rs"

# Out-of-process wire binary cross-built by `dist/scripts/deploy-distribution.sh`
# and staged under `/opt/evo/plugins/org.evoframework.network.shares/`; the
# framework's Phase-2 discovery walks the search root at boot and admits the
# bundle.
[[bin]]
name = "network-shares-wire"
path = "src/bin/network-shares-wire.rs"

[dependencies]
anyhow = { workspace = true }
async-trait = "0.1"
evo-plugin-sdk = { workspace = true }
semver = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["process"] }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }
tempfile = { workspace = true }

[lints]
workspace = true
