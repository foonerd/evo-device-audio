schema_version: "1.0"
plugin: org.evoframework.network.shares
owner: evo-device-audio
isolation: oop
has_os_dependencies: true

# Out-of-process plugin shipped as a signed bundle under
# `/opt/evo/plugins/org.evoframework.network.shares/`. The
# steward spawns the wire binary as a subprocess and wires the
# SDK contract over a Unix domain socket. The plugin's core
# function is discovery and mounting of NAS-hosted SMB and NFS
# shares under `/var/lib/evo/music/NAS/<alias>`. Every mount path requires
# out-of-plugin host binaries (`mount.cifs`, `mount.nfs`,
# `smbclient`, `avahi-browse`); their absence is not a
# recoverable runtime condition — a plugin admitted onto a host
# missing any of these can neither discover nor mount and every
# verb dispatches into an error path. Admission MUST refuse or
# degrade to `Unhealthy` with the missing binary named; the
# operator UI renders the resulting health state honestly.

capability_intent:
  - id: cifs_mount
    need: invoke `mount.cifs` to mount an SMB / CIFS share under `/var/lib/evo/music/NAS/<alias>`. Called from the `network.share.mount` verb after credential negotiation; called again on service restart to re-establish previously-persisted mounts. Runs as root because Linux mount() is a privileged syscall regardless of the target filesystem; a non-root service identity dispatches via `sudo -n mount.cifs` against a narrow NOPASSWD drop-in shipped by the distribution's bootstrap. Failure surfaces as a structured `MountFailed { code, stderr }` on the share subject; the steward keeps running.
    access_path: sudoers/command
    failure_mode: The `network.share.mount` returns PluginError::Permanent naming the mount helper; the share stays in the discovered state; the operator UI's remedy string names the missing binary.
  - id: nfs_mount
    need: invoke `mount.nfs` to mount an NFS share under `/var/lib/evo/music/NAS/<alias>`. Same dispatch shape as `cifs_mount` (root direct, sudo -n against a distribution drop-in when service identity is non-root). NFSv3 and NFSv4 share the same helper.
    access_path: sudoers/command
    failure_mode: The `network.share.mount` on an NFS-typed share returns PluginError::Permanent naming the missing helper; the share stays discovered; SMB shares continue to work if `mount.cifs` is present.
  - id: smbclient_probe
    need: invoke `smbclient -L <host>` for share enumeration during discovery and `smbclient -N -L <ip> -m SMB3_11 --debuglevel=4` for dialect negotiation on the discovery path. Read-only against the target NAS; no elevation required (runs unprivileged by design).
    access_path: direct exec
    failure_mode: absent smbclient means discovery cannot list a NAS's share catalog; the plugin degrades discovery to "hostname visible via mDNS but no share list"; explicit-config mount paths (operator supplies host + share by hand) continue to work.
  - id: avahi_browse
    need: invoke `avahi-browse -atrkp _smb._tcp` for mDNS discovery of SMB-advertising NAS devices on the LAN. Read-only against the local mDNS daemon; no elevation required.
    access_path: direct exec
    failure_mode: absent avahi-browse means mDNS-driven discovery is unavailable; the plugin degrades to explicit-config paths only; the operator UI's discovery panel reports "mDNS discovery unavailable — configure shares by hand" and names the missing binary.

required_binaries:
  - name: mount.cifs
    min_version: "6.0"
    failure_mode: refuse to admit; the plugin's primary verb (mount) has no fallback for SMB shares. Structured admission error names the missing binary and the Debian / Fedora / Alpine / Arch package that provides it (`cifs-utils`).
  - name: mount.nfs
    min_version: "2.0"
    failure_mode: warn at admission and mark the plugin degraded with reason `nfs_mount_helper_missing`; SMB shares continue to work; NFS mounts refuse at the `network.share.mount` verb boundary with a structured error naming the missing binary.
  - name: smbclient
    min_version: "4.10"
    failure_mode: warn at admission and mark the plugin degraded with reason `smbclient_missing`; discovery narrows to hostname-only; explicit-config paths continue to work. Package that provides this — Debian `smbclient`, Fedora `samba-client`, Alpine `samba-client`, Arch `smbclient`.
  - name: avahi-browse
    min_version: "0.7"
    failure_mode: warn at admission and mark the plugin degraded with reason `avahi_browse_missing`; mDNS discovery becomes unavailable; explicit-config paths continue to work. The `avahi-utils` package provides this on every supported distribution.

required_kernel_modules:
  - cifs
  - nfs

required_system_services:
  - avahi-daemon.service

verification:
  commands:
    - "test -d /var/lib/evo"
    - "test -d /var/lib/evo/music/NAS"
  expected:
    - state directory exists as the steward identity
    - mount root exists at /var/lib/evo/music/NAS (created by the distribution installer per the four-primitive install/reset contract; the plugin never creates it)

# Per-distribution package hints for the online installer.
# The privileges schema's `host_provisioning` block describes
# systemd unit / polkit / capabilities per distribution. The
# package list here is out-of-band metadata the installer's
# manifest generator reads via a distinct convention (each
# required_binaries entry's failure_mode names the providing
# package inline).
host_provisioning: {}
