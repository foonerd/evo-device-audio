# HDA codec overlay — operator-friendly chip family labels for
# Intel HD-Audio codecs encountered on x86_64 / amd64 hosts.
#
# Keyed by 32-bit `vendor_id` (as read from
# /proc/asound/cardN/codec#N's `Vendor Id:` field). The kernel
# reports a chip family string on the `Codec:` line for every
# entry below; the catalog rebrands or augments where a more
# operator-meaningful label exists. Catalog miss → kernel chip
# name surfaces as the fallback label (no silent loss).
#
# Initial dataset focuses on codec variants common on recent
# x86 / amd64 mainboards (mainstream + workstation vintage).
# Coverage widens by extending this section — the lookup
# infrastructure is fixed; only the data table grows.

