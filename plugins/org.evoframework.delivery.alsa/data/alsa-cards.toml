# ============================================================
# AC97 codec overlay — operator-friendly chip labels for AC97
# codecs encountered on amd64 / x86 hosts with pre-HDA audio
# (Intel ICH, VIA 82xx, ALi 5451, ATI IXP, Cirrus, etc.).
#
# Keyed by the chip name as the kernel surfaces it on the first
# line of /proc/asound/cardN/codec97#N/ac97#0-0 (verbatim,
# case-sensitive). The kernel name is already operator-readable
# (it resolves the AC97 vendor/device-id registers internally);
# the catalogue overlay rebrands only where a preferred form
# exists. Catalogue miss → kernel chip name surfaces as the
# fallback label (no silent loss).
#
# Coverage focuses on the most prevalent AC97 codec families on
# consumer + workstation x86 hardware shipped 1999-2010 vintage.
# AC97 was superseded by HDA on Intel platforms with the
# ICH7/ICH8/ICH9 transition, so this catalogue extends mainly
# for boards still serviced from that era or virtualised /
# emulated AC97 cards (qemu's `intel-hda-modular,model=duplex`
# defaults to AC97-compatible).

