[plugin]
name = "org.evoframework.system.info"
# The workspace version; keep equal to [workspace.package].version, which
# this crate inherits and get_system_version answers as `build`.
version = "0.1.13"
contract = 1

[target]
shelf = "system.info"
shape = 1

[kind]
instance = "singleton"
interaction = "respondent"

[transport]
type = "out-of-process"
exec = "plugin.bin"

[trust]
class = "platform"

[prerequisites]
evo_min_version = "0.1.13"
os_family = "linux"
outbound_network = false
filesystem_scopes = []

[resources]
max_memory_mb = 8
max_cpu_percent = 1

[lifecycle]
mode = "reactive-only"
autostart = true
restart_on_crash = true
restart_budget = 5

[capabilities.respondent]
request_types = ["get_system_info", "get_system_version"]
response_budget_ms = 2000

[capabilities.respondent.verb_capabilities]
get_system_info = { kind = "read", scope = "system" }
get_system_version = { kind = "read", scope = "system" }
