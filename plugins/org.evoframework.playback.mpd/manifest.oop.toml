[plugin]
name = "org.evoframework.playback.mpd"
# Keep in sync with this crate's Cargo.toml [package].version (PluginIdentity + packaging).
version = "0.1.0"
contract = 1

# Multi-stocking declaration: this plugin stocks five shelves on
# the audio rack from one process. See manifest.toml for the
# carving rationale; the OOP wire-side manifest mirrors it verbatim
# so the OOP build admits with the same stocking topology as the
# in-process build.
[[stockings]]
shelf = "audio.playback"
shape = 1
role  = "warden"
request_types = [
    "play_now",
    "play",
    "pause",
    "resume",
    "stop",
    "next",
    "previous",
    "seek",
    "seek_by_delta",
    "set_volume",
    "set_mute",
    "set_repeat",
    "set_shuffle",
    "set_single",
    "set_consume",
    "get_now_playing",
    "get_stream_format",
]

[[stockings]]
shelf = "audio.queue"
shape = 1
role  = "respondent"
request_types = [
    "queue.get_queue",
    "queue.enqueue",
    "queue.remove_queue_item",
    "queue.move_queue_item",
    "queue.clear_queue",
    "queue.load_playlist_to_queue",
    "queue.append_playlist_to_queue",
    "queue.save_queue_as_playlist",
    "queue.skip_to_next_available",
    "queue.play_from_position",
    "queue.enqueue_selection",
]

[[stockings]]
shelf = "audio.playlist"
shape = 1
role  = "respondent"
request_types = [
    "playlist.list_playlists",
    "playlist.get_playlist",
    "playlist.create_playlist",
    "playlist.delete_playlist",
    "playlist.rename_playlist",
    "playlist.add_to_playlist",
    "playlist.remove_from_playlist",
    "playlist.move_in_playlist",
    "playlist.save_selection",
]

[[stockings]]
shelf = "audio.favourites"
shape = 1
role  = "respondent"
request_types = [
    "favourites.list_favourites",
    "favourites.is_favourite",
    "favourites.add_favourite",
    "favourites.remove_favourite",
    "favourites.clear_favourites",
    "favourites.move_favourite",
]

[[stockings]]
shelf = "audio.library"
shape = 1
role  = "respondent"
request_types = [
    "library.list_sources",
    "library.add_source",
    "library.remove_source",
    "library.probe_source",
    "library.wake_source",
    "library.update_source",
    "library.browse_library",
    "library.search_library",
    "library.list_works",
    "library.get_work_recordings",
    "library.browse_by_artist",
    "library.browse_by_album",
    "library.browse_by_genre",
    "library.browse_by_year",
]

[kind]
instance = "singleton"
interaction = "warden"

[transport]
type = "out-of-process"
exec = "plugin.bin"

[trust]
class = "standard"

[prerequisites]
evo_min_version = "0.1.12"
os_family = "linux"
outbound_network = false
filesystem_scopes = []

[resources]
max_memory_mb = 32
max_cpu_percent = 5

[lifecycle]
# Reload-cleanable: operator-tunable state covers mpd-port +
# library-roots projection. A TOML edit triggers teardown +
# re-admit; the warden releases active custody on teardown and
# re-establishes it with the new configuration on re-admit.
# Custody release during reload is operator-visible (the
# playback queue pauses for the teardown + admit window — bounded
# by the manifest's admit/teardown deadlines).
mode = "reload-cleanable"
autostart = true
restart_on_crash = true
restart_budget = 5

[capabilities.warden]
custody_domain = "playback"
custody_exclusive = true
course_correction_budget_ms = 1000
custody_failure_mode = "abort"
# course_correct verb set the warden honours. The framework
# refuses any verb not in this list at the router boundary
# before the warden's `course_correct` body is invoked.
# Mirrors the audio.playback shape v1 contract; the runtime
# constants in src/lib.rs hold the same list verbatim.
course_correct_verbs = [
    "play",
    "pause",
    "stop",
    "next",
    "previous",
    "seek",
    "seek_by_delta",
    "set_volume",
    "set_mute",
    "set_repeat",
    "set_shuffle",
    "set_single",
    "set_consume",
    "emit_test_tone",
]

# Source-plugin declaration. The plugin owns the `mpd-path`
# URI scheme (paths the local MPD daemon's library knows
# about) and bridges into the audio data plane: the
# framework hands the plugin a typed WriteEndpoint via
# LoadContext::audio_routing, and the plugin renders MPD's
# audio_output config to point there (chunks F3 onwards).
# bit_perfect_capable + preferred_topology = no_intermediate
# tell the reconciliation engine that MPD writes directly
# to the delivery hardware when format-aligned, no
# intermediate composition stage required.
[capabilities.source]
uri_schemes = ["mpd-path"]
output_kind = "audio.pcm"
bit_perfect_capable = true
preferred_topology = "no_intermediate"

# Audio formats MPD can produce when wired through the
# ALSA audio_output plugin. Standard PCM bit-depths at
# common audiophile rate ladder. DSD output (DoP / native)
# is a later improvement (gated on delivery's DSD capability and
# operator policy).
[[capabilities.source.audio_formats]]
kind = "pcm"
codec = "pcm_s16_le"
rate_hz = [44100, 48000, 88200, 96000, 176400, 192000]
channels = 2

[[capabilities.source.audio_formats]]
kind = "pcm"
codec = "pcm_s24_le"
rate_hz = [44100, 48000, 88200, 96000, 176400, 192000]
channels = 2

[[capabilities.source.audio_formats]]
kind = "pcm"
codec = "pcm_s32_le"
rate_hz = [44100, 48000, 88200, 96000, 176400, 192000]
channels = 2

# Respondent capabilities. Source plugins MUST also be
# respondents — source verbs targeting the URI schemes
# this plugin owns arrive via handle_request. The full
# state-transition set ships here: play_now loads-and-plays
# a specific mpd-path URI; play / pause / resume / stop /
# next / previous / seek / set_volume drive the supervisor
# through its existing PlaybackCommand surface so the
# warden's course_correct path and the source-verb dispatch
# path share the same execution machinery (different
# entry points, identical outcome).
[capabilities.respondent]
request_types = [
    "play_now",
    "play",
    "pause",
    "resume",
    "stop",
    "next",
    "previous",
    "seek",
    "seek_by_delta",
    "set_volume",
    "set_mute",
    "set_repeat",
    "set_shuffle",
    "set_single",
    "set_consume",
    "get_now_playing",
    "get_stream_format",
    # audio.queue.v1 shelf verbs
    "queue.get_queue",
    "queue.enqueue",
    "queue.remove_queue_item",
    "queue.move_queue_item",
    "queue.clear_queue",
    "queue.load_playlist_to_queue",
    "queue.append_playlist_to_queue",
    "queue.save_queue_as_playlist",
    "queue.skip_to_next_available",
    "queue.play_from_position",
    "queue.enqueue_selection",
    # audio.playlist.v1 shelf verbs
    "playlist.list_playlists",
    "playlist.get_playlist",
    "playlist.create_playlist",
    "playlist.delete_playlist",
    "playlist.rename_playlist",
    "playlist.add_to_playlist",
    "playlist.remove_from_playlist",
    "playlist.move_in_playlist",
    "playlist.save_selection",
    # audio.favourites.v1 shelf verbs
    "favourites.list_favourites",
    "favourites.is_favourite",
    "favourites.add_favourite",
    "favourites.remove_favourite",
    "favourites.clear_favourites",
    "favourites.move_favourite",
    # audio.library.v1 shelf verbs
    "library.list_sources",
    "library.add_source",
    "library.remove_source",
    "library.probe_source",
    "library.wake_source",
    "library.update_source",
    "library.browse_library",
    "library.search_library",
    "library.list_works",
    "library.get_work_recordings",
    "library.browse_by_artist",
    "library.browse_by_album",
    "library.browse_by_genre",
    "library.browse_by_year",
]
response_budget_ms = 2000
