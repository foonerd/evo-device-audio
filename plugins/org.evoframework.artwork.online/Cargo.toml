[package]
name = "org-evoframework-artwork-online"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Online album-artwork respondent: Cover Art Archive (MusicBrainz), Last.fm, iTunes, Volumio meta cascade. Co-occupies the artwork.providers shelf with org.evoframework.artwork.local."

[lib]
path = "src/lib.rs"

[[bin]]
name = "artwork-online-wire"
path = "src/bin/artwork-online-wire.rs"

[dependencies]
anyhow = { workspace = true }
evo-plugin-sdk = { workspace = true }
evo-device-audio-shared = { workspace = true }
evo-online-providers = { path = "../../crates/evo-online-providers" }
semver = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# `fs` is on top of the workspace default because the persistent
# artwork.online sidecars (reconcile-index, provider-index) live
# under the plugin's state_dir and use tokio::fs for atomic
# tempfile+rename writes and non-blocking reads on the request
# hot path.
tokio = { workspace = true, features = ["fs"] }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Outbound HTTPS for online artwork providers. rustls backend
# matches the framework's existing TLS posture (no system OpenSSL
# dependency on cross-build targets).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
# Stable content_hash + URL-safe artwork addressing.
sha2 = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
# Image decode + Lanczos3 resize + WebP encode — same posture
# as artwork.local, so the size taxonomy round-trip is shared.
image = { workspace = true }
webp = { workspace = true }
# Fixed-capacity LRU for the artist-artwork reconcile + result
# caches. Bounds the working set (~5000 keys) so a large
# library cannot exhaust the plugin's memory, and evicts the
# oldest entry on insert. Small (~15 KB), zero transitive deps.
lru = "0.12"
# Parallel-race semantics on the Tier 1 cover-art cascade:
# FuturesUnordered gives first-completed-wins across CAA +
# iTunes + Deezer without waiting for the slowest to finish.
futures-util = "0.3"
# Process-local circuit-breaker state for the per-provider
# open/closed tracking.
once_cell = "1"

[dev-dependencies]
tempfile = { workspace = true }
