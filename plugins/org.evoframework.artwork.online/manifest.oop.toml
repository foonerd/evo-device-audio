# Out-of-process manifest for org.evoframework.artwork.online.
#
# Production bundle source; the publish pipeline renames this
# file to `manifest.toml` inside the staged bundle. Shape mirrors
# the in-process variant; the transport block differs.

[plugin]
name = "org.evoframework.artwork.online"
version = "0.1.0"
contract = 1

[[stockings]]
shelf = "artwork.providers"
shape = 1
role = "respondent"
request_types = [
    "artwork.resolve_online",
    "artwork.resolve_artist_artwork",
    "artwork.online.clear_cache",
]

[kind]
instance = "singleton"
interaction = "respondent"

[transport]
type = "out-of-process"
exec = "plugin.bin"

[trust]
class = "standard"

[prerequisites]
evo_min_version = "0.1.13-dev"
os_family = "linux"
filesystem_scopes = []
outbound_network = true

[resources]
max_memory_mb = 32
max_cpu_percent = 5

[lifecycle]
mode = "reload-cleanable"
autostart = true
restart_on_crash = true
restart_budget = 5

[capabilities.respondent]
request_types = [
    "artwork.resolve_online",
    "artwork.resolve_artist_artwork",
    "artwork.online.clear_cache",
]
response_budget_ms = 15000
