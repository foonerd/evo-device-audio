[package]
name = "org-evoframework-network"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Multi-source network plugin for the evo framework. Stocks the networking.link shelf; fans in from rtnetlink (kernel netlink), NetworkManager D-Bus, and a universal polling floor under a per-platform source preset."

[lib]
path = "src/lib.rs"

[[bin]]
name = "network-wire"
path = "src/bin/network-wire.rs"

[features]
# Polling source is always compiled — universal correctness floor.
# Rtnetlink source lives in the shared `evo-network-state` crate
# and is enabled via that crate's `source-rtnetlink` feature
# (default on).
default = ["source-rtnetlink", "source-nm"]
# Forwards to `evo-network-state`'s rtnetlink feature so non-Linux
# builds of the plugin can disable it without dragging the netlink
# dependency tree.
source-rtnetlink = [
    "evo-network-state/source-rtnetlink",
]
# NetworkManager D-Bus subscriber. Observes the NM
# `Connectivity` property + per-device `StateChanged` signals
# via `org.freedesktop.NetworkManager` on the system bus.
# Linux-only; the source's module is cfg-gated alongside
# the dependency tree.
source-nm = [
    "dep:zbus",
    "dep:futures",
]

[dependencies]
anyhow = { workspace = true }
async-trait = "0.1"
evo-network-state = { path = "../../../evo-core-eng/crates/evo-network-state", default-features = false }
evo-plugin-sdk = { workspace = true }
semver = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = "1"
tokio = { workspace = true, features = ["process", "fs"] }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
base64 = { workspace = true }
chacha20poly1305 = { workspace = true }
getrandom = { workspace = true }
sha2 = { workspace = true }

# NetworkManager D-Bus subscriber. Pure-Rust async D-Bus
# client; the system-bus connection backs `org.freedesktop
# .NetworkManager` PropertiesChanged + Device.StateChanged
# subscriptions.
zbus = { version = "5", default-features = false, features = ["tokio"], optional = true }
# Futures channel + stream traits used by the NM source.
futures = { version = "0.3", optional = true }

[lints]
workspace = true

[dev-dependencies]
tempfile = { workspace = true }
