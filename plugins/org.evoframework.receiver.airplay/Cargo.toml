[package]
name = "org-evoframework-receiver-airplay"
# Keep in sync with manifest.toml [plugin].version and PluginIdentity in describe().
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The device as an AirPlay 2 audio receiver, built in-process on the evo-airplay library. Registers the device with the local mDNS daemon, owns the session gate, the pairing password and the LAN filter, and publishes the reactive audio_receiver_airplay subject. Default disabled; enable and disable are write verbs under network_admin."

[lib]
path = "src/lib.rs"

[[bin]]
name = "receiver-airplay-wire"
path = "src/bin/receiver-airplay-wire.rs"

[dependencies]
anyhow = { workspace = true }
async-trait = "0.1"
evo-airplay = { path = "../../crates/evo-airplay" }
evo-plugin-sdk = { workspace = true }
semver = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["net", "time", "sync", "rt", "macros", "io-util", "fs"] }
tracing = { workspace = true }
# The system-bus client that registers the device with the local mDNS
# daemon (the same client the network plugin uses for NetworkManager).
zbus = { version = "5", default-features = false, features = ["tokio"] }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }

[lints]
workspace = true
