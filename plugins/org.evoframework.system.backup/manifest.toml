[plugin]
name = "org.evoframework.system.backup"
# Keep in sync with this crate's Cargo.toml [package].version (PluginIdentity + packaging).
version = "0.1.0"
contract = 1

[target]
shelf = "system.backup"
shape = 1

[kind]
instance = "singleton"
interaction = "respondent"

[transport]
type = "in-process"
exec = "<compiled-in>"

[trust]
class = "platform"

[prerequisites]
evo_min_version = "0.1.13"
os_family = "linux"
outbound_network = false
# Owns no files: every part of a backup is read from and put back
# through the owning plugin's shelf verbs.
filesystem_scopes = []

[resources]
max_memory_mb = 32
max_cpu_percent = 2

[lifecycle]
# Reactive-only: two operator gestures, no state, no background work.
mode = "reactive-only"
autostart = true
restart_on_crash = true
restart_budget = 5

[capabilities.respondent]
request_types = ["export_backup", "import_backup"]
# An import is one owner call per logical output, zone, zone EQ band,
# setting, preset and playlist, and a mixer change runs its own
# transition. 180 s covers a full restore.
response_budget_ms = 180000

[capabilities.respondent.verb_capabilities]
# Step-up gated like system.power's reboot_device: a backup carries
# the device's configuration, and an import rewrites it.
export_backup = { kind = "step_up", scope = "system_admin" }
import_backup = { kind = "step_up", scope = "system_admin" }
