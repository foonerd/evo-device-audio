[package]
name = "org-evoframework-system-backup"
# Keep in sync with manifest.toml [plugin].version and PluginIdentity in describe().
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Stocks the system.backup shelf: export_backup reads config, playlists and settings from the plugins that own them, and import_backup puts them back through the same owners. Holds no state of its own."

[lib]
path = "src/lib.rs"

# Out-of-process wire binary cross-built by `dist/scripts/deploy-distribution.sh`
# and staged under `/opt/evo/plugins/org.evoframework.system.backup/`; the
# framework's Phase-2 discovery walks the search root at boot and admits the
# bundle.
[[bin]]
name = "system-backup-wire"
path = "src/bin/system-backup-wire.rs"

[dependencies]
anyhow = { workspace = true }
evo-plugin-sdk = { workspace = true }
semver = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }

[lints]
workspace = true
