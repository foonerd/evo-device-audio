schema_version: "1.0"
plugin: org.evoframework.system.backup
owner: evo-device-audio
isolation: oop
has_os_dependencies: false

# Two operator gestures on the `system.backup` shelf. The plugin
# owns no file and no secret. Every part of a backup is read from,
# and put back through, the shelf verbs of the plugin that owns it,
# over the framework's shelf dispatcher. It reads no other plugin's
# state directory and no other plugin's credentials.

capability_intent:
  - id: owner_shelf_dispatch
    need: call the owners' shelf verbs through the framework's shelf dispatcher — `delivery.list_logical_outputs` and `delivery.add_logical_output` on `audio.delivery`; `zone.list`, `zone.add`, `zone.set_eq_engaged`, `zone.set_eq_band`, `zone.remove_eq_band`, `scene.list`, `scene.get` and `scene.put` on `audio.zones`; `playlist.list_playlists`, `playlist.export_file`, `playlist.import_file` and `playlist.create_playlist` on `audio.playlist`; `favourites.add_favourite` on `audio.favourites`; `options.get_settings`, `options.list_eq_presets`, `options.save_eq_preset` and the `options.set_*` setters on `audio.options`; `delivery.list_outputs` on `audio.delivery`, read before `output_device` goes back, and `delivery.list_mixers` on `audio.delivery`, read once before the three mixer fields go back; `alarm.get` and `alarm.set` on `audio.alarm`; `language.get`, `language.set`, `timezone.get` and `timezone.set` on `system.locale`, the zone read first and set only when it differs (the owner gates `timezone.set` at `system_admin`, which a dispatched call does not carry, so a differing zone is reported, not applied). No verb that removes anything, no scene is recalled, saved or removed, and nothing on `networking.shares`.
    access_path: framework/shelf_dispatch
    failure_mode: with no dispatcher both verbs refuse; an owner that cannot answer refuses the export; an item an owner refuses on import is reported and skipped.

required_binaries: []
required_kernel_modules: []
required_system_services: []

verification:
  commands:
    - "test -d /var/lib/evo"
  expected:
    - steward state directory exists
host_provisioning: {}
