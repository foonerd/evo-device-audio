[plugin]
name = "org.evoframework.identity.locale"
# Keep in sync with this crate's Cargo.toml [package].version (PluginIdentity + packaging).
version = "0.1.0"
contract = 1

[target]
shelf = "system.locale"
shape = 1

[kind]
instance = "singleton"
interaction = "respondent"

[transport]
type = "in-process"
exec = "<compiled-in>"

[trust]
class = "platform"

[prerequisites]
evo_min_version = "0.1.13"
os_family = "linux"
outbound_network = false
# The stored language lives in the plugin's own state directory.
filesystem_scopes = []

[resources]
max_memory_mb = 8
max_cpu_percent = 1

[lifecycle]
# Reactive-only: two setters, each answering what is in force.
mode = "reactive-only"
autostart = true
restart_on_crash = true
restart_budget = 5

[capabilities.respondent]
request_types = [
    "language.set",
    "timezone.set",
    "timezone.get",
    "timezone.list",
]
# timezone.set applies the zone, waits more than a second, then
# waits on alarm.reschedule before it answers.
response_budget_ms = 6000

[capabilities.respondent.verb_capabilities]
# language.set is absent: changing the language asks for no
# password. timezone.get and timezone.list are absent: they only
# read. A zone change is a per-device system setting, a write at
# system_admin, not step-up.
"timezone.set" = { kind = "write", scope = "system_admin" }
