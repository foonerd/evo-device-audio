schema_version: "1.0"
plugin: org.evoframework.identity.locale
owner: evo-device-audio
isolation: oop
has_os_dependencies: true

# Two setters on the `system.locale` shelf. The operator's language
# is stored in this plugin's own state directory. The device's zone
# is the host's: read with timedatectl, applied through one narrow
# NOPASSWD sudoers grant on a root-owned wrapper, after which the
# pending alarm is rescheduled through the shelf dispatcher.

capability_intent:
  - id: state_directory_read_write
    need: read and write `language.toml` in the plugin's own state directory (/var/lib/evo/plugins/org.evoframework.identity.locale/), holding the operator's language. Written only when a set applies a language the glass has a catalogue for, through a temporary file and a rename.
    access_path: filesystem/state
    failure_mode: a missing or unreadable file is no stored language, so the language in force is `en`; a failed write refuses the set and the language in force stays.
  - id: timezone_read
    need: read the zone in force with `timedatectl show --property=Timezone --value`, the host's zone list with `timedatectl list-timezones`, and the zone file under /usr/share/zoneinfo for its TZif header. Unprivileged; nothing is written.
    access_path: filesystem/system
    failure_mode: timezone.set answers PluginError::Transient naming what could not be read; nothing is applied.
  - id: set_timezone_invocation
    need: invoke `sudo -n /usr/local/bin/evo-set-timezone <zone>` to make one IANA zone the host's zone. The framework dispatcher's per-verb gate verifies write:system_admin before the request reaches the plugin. The wrapper takes exactly one argument, refuses `Factory`, a name that is not the shape of an IANA zone, a zone the host does not list, and a file without a TZif header, then runs `timedatectl set-timezone`. Surfaced as the `EVO_SET_TIMEZONE` sudoers Cmnd_Alias in `dist/sudoers.d/evo-set-timezone`.
    access_path: sudoers/command
    failure_mode: timezone.set answers PluginError::Transient carrying the sudo / wrapper stderr and the zone in force as timedatectl reads it afterwards; language.set is unaffected.
  - id: alarm_reschedule_dispatch
    need: after a zone is applied, wait more than one second, then call `alarm.reschedule { v: 1 }` on `audio.alarm` through the shelf dispatcher so the pending alarm is scheduled again on the new zone.
    access_path: framework/shelf_dispatch
    failure_mode: a refused reschedule answers PluginError::Transient naming the zone in force, which stays applied; sending the same zone again runs the reschedule again. Without a dispatcher, timezone.set refuses before anything is applied.

required_binaries:
  - name: timedatectl
    failure_mode: refuse to admit; structured admission error names the missing binary. timezone.set reads and applies the zone through it.
  - name: sudo
    min_version: "1.9"
    failure_mode: refuse to admit; the narrow NOPASSWD grant is how timezone.set reaches the wrapper.

required_kernel_modules: []
required_system_services: []

verification:
  commands:
    - "test -d /var/lib/evo"
    - "test -x /usr/local/bin/evo-set-timezone"
    - "test -f /etc/sudoers.d/evo-set-timezone"
    - "test \"$(systemctl show systemd-timedated -p LoadState --value)\" = loaded"
  expected:
    - steward state directory exists
    - timezone wrapper present at the canonical path
    - operator-installed narrow sudoers grant present
    - systemd-timedated is loaded, not masked
host_provisioning: {}
