[package]
name = "org-evoframework-artwork-local"
# Kept in sync with manifest.toml [plugin].version and PluginIdentity in describe().
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Local album-artwork respondent for the evo audio domain. Stocks the artwork.providers shelf."

[lib]
path = "src/lib.rs"

# Out-of-process wire binary — the production-shaped OOP entrypoint
# the framework's release plane cross-builds, signs, packs, and
# publishes as a plugin bundle. The companion in-process
# admission path uses the lib crate directly.
[[bin]]
name = "artwork-local-wire"
path = "src/bin/artwork-local-wire.rs"

[dependencies]
anyhow = { workspace = true }
evo-plugin-sdk = { workspace = true }
evo-device-audio-shared = { workspace = true }
lofty = { workspace = true }
semver = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Artwork transcoding: image decode + Lanczos3 resize + WebP
# encode. The plugin owns the resize work so the framework
# HTTPS surface stays thin (resolve + redirect).
image = { workspace = true }
# Lossy WebP encoder for resized variants. quality 82 — the
# Roon-class default; perceptually identical to quality 95 at
# thumbnail sizes; 40-60% bytes smaller than equivalent JPEG.
webp = { workspace = true }
# Stable content_hash for resized variants — SHA-256 truncated
# / hex-encoded for the asset-cache key surface.
sha2 = { workspace = true }
hex = { workspace = true }
# Base64 encode/decode for the artwork.resolve verb's
# wire-shape response: the plugin writes bytes to the asset
# cache and returns the content_hash; legacy in-process
# callers may still read the path field.
base64 = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
