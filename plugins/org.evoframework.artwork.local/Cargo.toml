[package]
name = "org-evoframework-artwork-local"
# Kept in sync with manifest.toml [plugin].version and PluginIdentity in describe().
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Local album-artwork respondent for the evo audio domain. Stocks the artwork.providers shelf."

[lib]
path = "src/lib.rs"

# Out-of-process wire binary — the production-shaped OOP entrypoint
# the framework's release plane cross-builds, signs, packs, and
# publishes as a plugin bundle. The companion in-process
# admission path uses the lib crate directly.
[[bin]]
name = "artwork-local-wire"
path = "src/bin/artwork-local-wire.rs"

[dependencies]
anyhow = { workspace = true }
evo-plugin-sdk = { workspace = true }
evo-device-audio-shared = { workspace = true }
# MPD's own tag index for the mpd-album resolve fast path —
# `find album <album> artist <artist>` returns matching files
# through MPD's O(index) lookup instead of the O(library) tag
# walk the local fallback uses. Cold browse over a large
# library is bounded by MPD find latency (single-digit ms per
# tile) regardless of track count.
evo-mpd-shared = { workspace = true }
lofty = { workspace = true }
semver = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
# Base64 encode/decode for the artwork.resolve verb's
# wire-shape response: the plugin writes bytes to the asset
# cache and returns the content_hash; legacy in-process
# callers may still read the path field.
base64 = { workspace = true }
# Transcode primitive (image decode + Lanczos3 resize + lossy
# WebP encode + SHA-256 content_hash) lives in
# evo-device-audio-shared so artwork.local and artwork.online
# consume one production-validated pipeline.

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
