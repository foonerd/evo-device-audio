#
# Keep NetworkManager off the access point's virtual interface
# until its profile is ready to bind — and no longer.
#
# The hotspot vif is created `type __ap` on the station's phy.
# NetworkManager takes any wifi device it manages and hands it to
# wpa_supplicant, which sets it up as a station — flipping the
# type to `managed`. On a phy whose interface combination allows
# one station and one access point, that second `managed`
# interface is refused by the kernel, and the refusal surfaces as
# "device or resource busy". The access point then never comes up.
#
# The steward marks the device unmanaged itself, but `nmcli` can
# only name an interface that already exists, so a brand-new vif
# is claimed in the gap between the netlink event and that call.
# This file closes the gap from the other side: the rule is in
# place before the interface appears, so there is no claim to
# race.
#
# It must also be a rule the steward can lift, because the same
# steward raises the hotspot on this interface moments later.
# `device.managed` is that rule. NetworkManager.conf(5): "this
# configuration can be overruled at runtime via D-Bus", which is
# what `nmcli device set ap0 managed yes` does.
#
# `[keyfile] unmanaged-devices` is NOT usable here, however much
# it reads like the right setting. The same manual: a device
# unmanaged by that option "is strictly unmanaged and cannot be
# overruled by using the API like nmcli device set $IFNAME managed
# yes" — and it names `device*.managed` as the better choice for
# exactly that reason. Used here, it kept the access point down
# permanently: the hand-back reported success and the activation
# was still refused, "because device is strictly unmanaged".

[device-evo-ap-vif]
match-device=interface-name:ap0
managed=0
