# /etc/asound.d/ write access for the evo service.
#
# `ProtectSystem=strict` (in the base evo.service) mounts the
# host filesystem read-only inside the unit's namespace except
# for paths explicitly listed in `ReadWritePaths`. The
# `mpd-restart-privileges.conf` drop-in widens that to include
# `/etc/evo` so config + state writes from inside the unit
# succeed.
#
# `/etc/asound.d/` is the modular-pipeline composition surface
# (per /etc/asound.conf's include list): the
# `org.evoframework.delivery.alsa` plugin writes the
# operator-options drop-in here on every gesture against the
# playback.options settings surface; the
# `org.evoframework.multiroom.evo-native` plugin writes the
# source-mode loopback drop-in here whenever it engages source
# role on a live group; the `org.evoframework.playback.mpd`
# plugin's asound-watcher reads here. Without write access the
# multi-room source-mode engage path fails with EROFS and
# pcm.evo cannot collapse back to direct-to-DAC on disengage.
#
# `-/etc/asound.d` (with the leading `-`) makes the path
# optional: a system that never installed the directory does
# not refuse to start the unit. The bootstrap-installed system
# always has the directory present.

[Service]
ReadWritePaths=-/etc/asound.d
