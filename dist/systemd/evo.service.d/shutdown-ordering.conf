# Systemd unit drop-in: shutdown ordering for the OOP-plugin
# architecture.
#
# Out-of-process plugins run as subprocesses of the steward and
# share this service's cgroup. Under systemd's default
# `KillMode=control-group`, `systemctl stop` / `systemctl
# restart` SIGTERMs every process in the cgroup at the same
# instant — steward AND every plugin. That collides with the
# steward's own drain sequence, which needs plugin subprocesses
# still alive so it can send `release_custody` and `Unload`
# frames over their wires and read acks back.
#
# `KillMode=mixed` sends SIGTERM only to the main process (the
# steward). Plugin subprocesses stay alive; the steward drives
# their shutdown via wire frames, exactly as its shutdown-report
# flow expects. After `TimeoutStopSec` the whole cgroup receives
# SIGKILL — a hard ceiling that catches any holdouts.
#
# `TimeoutStopSec=30s` gives comfortable headroom over the
# framework's built-in shutdown deadline (10 s default in
# `admission::ShutdownConfig`) plus per-plugin unload budgets.
# The audio reference distribution's plugin set drains well
# under that budget; raise on a vendor distribution that admits
# unusually slow-draining plugins.
#
# Without this drop-in, a `systemctl restart evo` on a session
# that had playback custody accepted produces two WARN log
# lines per restart (`custody release during shutdown did not
# complete cleanly`, `custody not released cleanly within
# drain window`) because the plugin subprocess was already dead
# from cgroup SIGTERM by the time the steward's custody drain
# reached it. The framework's zero-fail-in-logs discipline
# treats those WARN lines as showstoppers.
#
# Apply: drop this file at
# `/etc/systemd/system/evo.service.d/`, run `systemctl
# daemon-reload && systemctl restart evo.service`. Applied
# automatically by `dist/scripts/bootstrap.sh` when run with
# the default `EVO_INSTALL_SYSTEMD_DROP_INS=1`.

[Service]
KillMode=mixed
TimeoutStopSec=30s
