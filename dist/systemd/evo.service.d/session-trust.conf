# Systemd unit drop-in: session-trust configuration.
#
# Two environment variables let the framework wire the
# device-local kiosk mint + set-kiosk-password wire ops and
# the shared-secret step-up backend the operator UI's
# password card verifies against.
#
# - EVO_KIOSK_UIDS: comma-separated list of numeric UIDs
#   admitted on `mint_local_kiosk_session` +
#   `set_kiosk_password`. The typical entry is the
#   compositor's UID (Volumio's `volumio` user in the
#   reference distribution). Framework refuses both wire ops
#   with `allowlist_empty` when this variable is unset or
#   parses to zero UIDs — the correct floor for a
#   distribution that has not declared its compositor.
# - EVO_AUTH_SECRET_FILE: absolute path to the shared-secret
#   TOML file backing SharedSecretAuthService. The framework
#   loads users + argon2id PHC hashes at boot; the
#   `set_kiosk_password` wire op rewrites this file (0600
#   root:root) when the kiosk operator sets or rotates the
#   password. Missing file at boot leaves the AuthService
#   deny-all; the first kiosk `set_kiosk_password` call
#   seeds the file and subsequent boots pick up the entry.
#
# The framework's reference unit does NOT declare these
# variables — each distribution names its own compositor UID
# and secrets-file path. This drop-in is the audio reference
# distribution's opinion.

[Service]
# Volumio's compositor session runs as `volumio` (UID 1000
# on the reference image). Override in a per-image drop-in
# when the UID is not 1000.
Environment="EVO_KIOSK_UIDS=1000"
Environment="EVO_AUTH_SECRET_FILE=/etc/evo/auth/shared-secret.toml"
# Bootstrap pair preseed for headless devices. The operator
# writes their chosen preseed value to this file on the SD
# card before first plug-in (same convention as
# wpa_supplicant.conf / userconf.txt on stock Raspberry Pi
# OS). Framework reads it at boot; the first browser to
# call pair_complete with pair_id = "bootstrap" and
# code = <preseed> receives a paired-device bearer without
# needing a display. Single-use — first pair consumes the
# slot. Absent / empty file leaves the headless first-pair
# path unavailable this boot; the operator falls back to
# the reset gesture and adds the preseed on the next boot.
Environment="EVO_PAIR_PRESEED_FILE=/boot/evo/pair-preseed.txt"
