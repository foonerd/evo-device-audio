# Systemd unit drop-in: session-trust configuration.
#
# Environment variables driving the framework's session-trust
# surface on the audio reference distribution.
#
# - EVO_KIOSK_UIDS: comma-separated list of numeric UIDs
#   admitted on `mint_local_kiosk_session`. The typical entry
#   is the compositor's UID (Volumio's `volumio` user in the
#   reference distribution). Framework refuses the mint wire
#   op with `allowlist_empty` when this variable is unset or
#   parses to zero UIDs — the correct floor for a distribution
#   that has not declared its compositor.
#
# - EVO_PAIR_PRESEED_FILE: absolute path to a boot-partition
#   file whose contents seed the pair-once ceremony's
#   "bootstrap" attempt. The first browser to call
#   pair_complete with pair_id = "bootstrap" and code =
#   <preseed> receives a paired-device bearer without needing
#   a display. Single-use. Absent / empty file leaves the
#   headless first-pair path unavailable this boot.
#
# The step-up auth backend is `ShadowAuthService`, resolving
# `/etc/shadow` for the framework's own runtime user via the
# pure-Rust sha-crypt crate — no PAM, no winbind, no sssd, no
# configuration file. `set_kiosk_password` invokes
# `/usr/sbin/chpasswd -c SHA512 -R /` under sudo (per the
# `evo-set-kiosk-password.in` sudoers drop-in) to rewrite the
# runtime user's row in /etc/shadow. `EVO_AUTH_SECRET_FILE` is
# not consumed and is retained here only as a documented
# non-variable.
#
# The framework's reference unit does NOT declare these
# variables — each distribution names its own compositor UID
# and preseed file path. This drop-in is the audio reference
# distribution's opinion.

[Service]
# Volumio's compositor session runs as `volumio` (UID 1000
# on the reference image). Override in a per-image drop-in
# when the UID is not 1000.
Environment="EVO_KIOSK_UIDS=1000"
Environment="EVO_PAIR_PRESEED_FILE=/boot/evo/pair-preseed.txt"

# The framework's `set_kiosk_password` wire op invokes
# `sudo -n /usr/sbin/chpasswd -c SHA512 -R /` in a child
# process. Chpasswd creates a lock file (`/etc/passwd.lock`)
# and a temp file (`/etc/passwd+`) in `/etc/` before rewriting
# `/etc/passwd` and `/etc/shadow`. Because the framework unit
# is hardened with `ProtectSystem=strict` (mounts `/etc`
# read-only for the service and every child it spawns),
# chpasswd fails at the lock step with "cannot lock
# /etc/passwd; try again later".
#
# The narrowest fix that keeps ProtectSystem=strict for every
# other path is a ReadWritePaths carve-out for the four files
# chpasswd touches. `/etc/` as a directory is NOT added — the
# framework never writes bare files in `/etc/`; only chpasswd
# (running under sudo) touches these four rows.
#
# A narrower `ReadWritePaths=/etc/passwd /etc/shadow /etc/group
# /etc/gshadow` is insufficient: shadow-utils' `pw_lock()`
# creates a SIBLING lock file `/etc/passwd.lock` before touching
# the target row; that lock-file creation requires write to
# `/etc/` as a directory, not just the four bare files. The
# narrowest scope that lets chpasswd complete is `/etc/` itself.
# The framework never writes bare files in `/etc/` at any code
# path — only chpasswd (running under sudo, argv-scoped by the
# evo-set-kiosk-password sudoers drop-in) touches these rows.
# The broader carve-out is bounded by sudo argv-match, not by
# systemd unit hardening.
ReadWritePaths=/etc

# The `ShadowAuthService` step-up backend reads `/etc/shadow`
# directly to verify the runtime user's password. On Debian
# the shadow file is `-rw-r----- root:shadow`; the framework's
# runtime user must be in the `shadow` group. Adding the group
# via `SupplementaryGroups=` keeps the change scoped to this
# service — no per-image `/etc/group` edit that would persist
# beyond the framework.
#
# Without this line every `step_up_auth_verify` returns
# `BackendUnavailable{reason: read /etc/shadow: Permission
# denied}` even after `set_kiosk_password` has succeeded and
# rewritten the row.
SupplementaryGroups=shadow
