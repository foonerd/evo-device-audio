# Systemd unit drop-in: relax the framework's reference
# hardening enough for the network.smb-server plugin's
# user-provisioning surface to function on this
# distribution.
#
# The framework's reference `evo.service.example` bakes in
# `ProtectSystem=strict`. Under that posture, the entire
# root filesystem is mounted read-only for the steward and
# every descendant — even sudo-elevated ones. Root does not
# override a read-only mount.
#
# The distribution's `org.evoframework.network.smb-server`
# plugin invokes the narrow root-only wrapper
# `/usr/local/bin/evo-smb-user-sync` (installed by
# `Step 1f` of this same bootstrap script, and granted
# NOPASSWD via `/etc/sudoers.d/evo-samba-server`) to
# provision named SMB users. The wrapper runs
# `useradd` + `smbpasswd -a` under sudo. `useradd` writes
# `/etc/passwd` + `/etc/shadow`, which the audio-tier
# `mpd-restart-privileges.conf` drop-in already carves out
# via `ReadWritePaths=/etc`. `smbpasswd -a` opens
# `/var/lib/samba/private/{passdb,secrets}.tdb` for read +
# write and updates them in place — Samba's `security =
# user` + `tdbsam` passdb requires it. Without this drop-in
# that open fails with EROFS (verified on rig 2026-08-07
# via strace of the failing wire path:
# `openat("/var/lib/samba/private/secrets.tdb",
#         O_RDWR|O_CREAT|O_CLOEXEC, 0600) = -1 EROFS`),
# and the operator UI's "Add user" gesture surfaces the
# EROFS text — a false runtime error caused by an over-
# constrained systemd posture, not an actual plugin defect.
#
# The relaxation applied here is at distribution scope,
# specifically:
#
#   - `ReadWritePaths=/var/lib/samba` — narrowest possible
#     write widening; scopes to the Samba state root only.
#     Neither `/var` nor `/var/lib` at large is carved out.
#     Samba's tdb + shared-memory files live under this
#     tree; the wrapper's short-lived subprocesses need
#     write access to `/var/lib/samba/private` (passdb +
#     secrets) on every `user_add` / `user_revoke`.
#
# Vendor distributions that ship the `network.smb-server`
# plugin admitted but do NOT want to relax the framework's
# hardening posture can drop this conf and the plugin's
# user-provisioning verbs return the wire error class the
# runtime now emits (`smbpasswd -a failed`); share
# management (`network.smb_server.apply`) is unaffected
# because the renderer writes `/etc/samba/smb.conf` via
# `sudo install` under the separate
# `EVO_SAMBA_SERVER_INSTALL` sudoers alias (which needs
# only `/etc` writability, granted by
# `mpd-restart-privileges.conf`'s ReadWritePaths).
#
# Apply: drop this file at
# `/etc/systemd/system/evo.service.d/`, run `systemctl
# daemon-reload && systemctl restart evo.service`. Applied
# automatically by `dist/scripts/bootstrap.sh` when run
# with the default `EVO_INSTALL_SYSTEMD_DROP_INS=1`.

[Service]
ReadWritePaths=/var/lib/samba
