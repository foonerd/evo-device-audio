# Catalogue extension for the audio domain.
#
# Distributions admitting the evo-device-audio plugin set
# include this rack + subjects + relation predicates in
# their catalogue. It is NOT a complete catalogue on its
# own — it omits `schema_version` and any framework-tier
# rack the distribution chooses to admit alongside (e.g.
# the validation distribution's `acceptance` rack); the
# distribution composes a full catalogue from this and
# whatever else it admits.
#
# The fragment declares the racks the audio reference
# distribution carries: `audio` (composition, playback,
# delivery, options, multiroom), `networking` (link),
# `metadata` (providers), and `artwork` (providers). The
# subject + relation declarations cover the subject-graph
# emission the audio playback warden makes on every song
# change (track + album subjects with the `album_of`
# relation, and its `tracks_of` inverse), the operator-
# facing audio options projection, the network connectivity
# verdict, and the multi-room frame-trace + device-card
# projections.
#
# Reference plugins that stock these shelves live in
# `evo-device-audio/plugins/` and are admitted in-process
# by the `evo-device-audio` steward binary
# (`crates/evo-device-audio-distribution`). Vendor
# distributions that swap one or more reference plugins for
# their own implementations carry a different catalogue
# fragment that declares the same shelves with the vendor's
# plugin set.

[[racks]]
name = "audio"
family = "domain"
kinds = ["registrar"]
charter = """
Audio data plane reference: substrate-aware composition + \
MPD-backed playback warden, owning the mpd-path URI scheme. \
"""

[[racks.shelves]]
name = "composition"
shape = 2
description = """
Audio data plane composition stage. Substrate-aware \
respondent; declares typed [capabilities.composition] modes; \
consumes LoadContext::audio_routing for endpoint resolution.
"""

[[racks.shelves]]
name = "playback"
shape = 1
description = """
Audio playback warden. Owns playback custody; handles \
course_correct verbs; also exposes a respondent surface \
for source-verb dispatches (play_now) targeting the \
mpd-path URI scheme.
"""

[[racks.shelves]]
name = "dlna"
shape = 1
description = """
UPnP/DLNA MediaServer client (org.evoframework.source.dlna). \
SSDP discovery + paged ContentDirectory browse + HTTP stream \
resolve. Discovered servers sync into audio.library as \
network_dlna sources for the unified Library UI.
"""

[[racks.shelves]]
name = "delivery"
shape = 2
description = """
Audio delivery stage. Owns the modular ALSA pipeline \
(pcm.evo defined in /etc/asound.conf); declares the \
WriteEndpoint other audio-producing plugins write into. \
Exposes a respondent surface for operator-facing hardware \
inspection (delivery.probe_hardware / list_cards / list_mixers \
/ active_endpoint) consumed by the playback.options plugin to \
drive output-device selection.
"""

[[racks.shelves]]
name = "options"
shape = 2
description = """
Operator-facing playback settings. Persists audiophile \
preferences across steward restarts (resampling / mixer_type \
/ mixer_device / mixer_control / DOP / output_device / \
volume_normalization / startup_volume / max_volume / \
volume_curve). Emits `Happening::PluginEvent` with event_type \
`audio.options.changed` on every setter so the delivery \
plugin re-renders the modular ALSA pipeline and the UI \
surfaces stay coherent. The orchestrator emits four \
`audio.mixer_transition.{started, applied, rolled_back, failed}` \
lifecycle happenings per mixer-mode gesture under a \
per-plugin transition lock; the `envelope_requested` + \
`envelope_observed` subject pair coordinates the safety \
envelope's pre-mute / unmute steps across the audio.playback \
warden.
"""

[[racks.shelves]]
name = "multiroom"
shape = 1
description = """
Multi-room audio-frame fan-out + receiver-side render plugin. \
Bridges the local audio chain to the framework's audio-plane \
TCP transport. Source-host role: capture from the local audio \
chain, encode into AudioFrame envelopes, fan to receivers via \
the framework's audio-plane handle. Receiver role: subscribe \
to incoming frames, decode, render to local ALSA at the \
scheduling target the envelope's presentation_time_ms declares. \
Role flips dynamically per the framework's source-host election.
"""

[[racks.shelves]]
name = "queue"
shape = 1
description = """
Operator-facing audio playback queue management. Source-state \
aware: every queue item carries `available` semantics derived \
from per-source state + an `evo:available` MPD sticker, so \
mixed-source queues (local + USB + NAS + cloud) survive a \
source going offline mid-playlist by skipping unreachable \
items + emitting a typed `Disposition`. Owns the canonical \
queue projection on the `audio.queue.v1` shelf subject. \
Verbs: get_queue, enqueue, remove_queue_item, move_queue_item, \
clear_queue, load_playlist_to_queue, append_playlist_to_queue, \
save_queue_as_playlist, skip_to_next_available.
"""

[[racks.shelves]]
name = "playlist"
shape = 1
description = """
Operator-facing stored playlist management. Wraps MPD's \
stored-playlist namespace as the single source of truth; \
favourites are a reserved internal playlist name protected \
from delete + rename. Publishes the playlist index on the \
`audio.playlist.v1` shelf subject. Verbs: list_playlists, \
get_playlist, create_playlist, delete_playlist, rename_playlist, \
add_to_playlist, remove_from_playlist, move_in_playlist.
"""

[[racks.shelves]]
name = "favourites"
shape = 1
description = """
Operator-facing favourites set. A set-semantic view onto a \
reserved internal MPD playlist (`__favourites__`); add is \
idempotent (silent no-op on duplicates); membership query \
served from an in-memory mirror refreshed on every mutating \
verb. Publishes the favourites projection on the \
`audio.favourites.v1` shelf subject. Verbs: list_favourites, \
is_favourite, add_favourite, remove_favourite, clear_favourites, \
move_favourite.
"""

[[racks.shelves]]
name = "library"
shape = 1
description = """
Operator-facing library + source management. Owns the source \
registry (local-internal floor + operator-attached USB / NAS / \
cloud sources) with a state machine (Probing / Online / \
Degraded / Offline / Retired). Lazy-browse for cloud sources, \
eager scan for local + NAS. Browse_library returns the last \
known listing with `stale: true` when the source is Offline \
(stale-cache-on-offline contract — never refuses, never empty). \
Publishes the source listing, browse, and search projections on \
the `audio.library.v1` shelf subject. Verbs: list_sources, \
add_source, remove_source, probe_source, wake_source, \
update_source, browse_library, search_library, list_works, \
get_work_recordings.
"""

[[racks.shelves]]
name = "terminus"
shape = 1
description = """
Audio terminus plugin. Canonical owner of every post-mixer \
audio-derived signal: parallel-tapped from pcm.evo via \
snd-aloop, owns the spectrum FFT compute (256-bin mel-scale \
stereo Float32 at 30 Hz with perceptual signals — peak-hold, \
per-band onset events, L/R correlation), exposes the \
audio-plane capture surface for cross-plugin consumers. \
Source-agnostic: every source plugin (MPD today, AirPlay / \
Cast / Spotify Connect / streaming-radio in the future) writes \
to pcm.evo and gets every post-mixer signal for free. The \
terminus is a parallel slave of the multi-slave tee in \
/etc/asound.conf — the primary slave is hw:CARD=<dac>, the \
terminus tap is snd-aloop subdev 7. The local-playback floor \
invariant is preserved by construction: terminus failure, \
absence, or crash cannot silence the primary audio path.
"""

[[racks]]
name = "hardware"
family = "domain"
kinds = ["registrar"]
charter = """
Audio hardware enablement surface: DAC catalogue + DSP \
capability resolution + boot-config dtoverlay management + \
DIY DTBO modder workflow. One shelf per hardware domain; \
the audio shelf covers DAC selection, per-DAC DSP control \
surface, hardware self-test, and the operator-gestured \
modder workflow for custom DTBO uploads.
"""

[[racks.shelves]]
name = "audio"
shape = 1
description = """
Audio hardware enablement respondent. Owns the DAC catalogue \
(built-time-imported from the data/import/ provenance \
sources) + curated DSP control pool + three-layer DSP \
capability resolver (catalogue dsp_options[] -> control pool \
-> live amixer cget). Operator gestures: select_dac / \
clear_dac / list_dacs / verify_install + per-DAC DSP \
control get|set + modder workflow \
(list_overlays / register_overlay / remove_overlay) when \
the per-DAC advanced_settings_enabled flag is on AND the \
distribution-tier modder gate permits it. Publishes \
evo.hardware.audio:capabilities, :active_config, \
:dsp_capabilities, :pending_reboot subjects + emits the \
hardware.audio.reboot_required + hardware.audio.dsp \
.control_changed happenings.
"""

[[racks]]
name = "networking"
family = "domain"
kinds = ["registrar"]
charter = """
Host networking surface: NetworkManager-backed connection \
control + Wi-Fi radio + connectivity-check + captive-portal \
helpers. One shelf for the link-layer operator surface; \
additional shelves (link aggregation, VPN, etc.) attach as \
their plugins land.
"""

[[racks.shelves]]
name = "link"
shape = 1
description = """
Host link-layer respondent. Single claimant: \
`org.evoframework.network` (NetworkManager + nmcli + iw \
virtual `ap0` + rfkill — not classic hostapd/dhcpcd). \
Operator verbs: status / scan / intent.get|set|apply / \
captive.* / security.* / flight_mode.get|set / radio.* / \
supervisor.status / wifi_devices / refresh_connectivity. \
Intent covers DHCP|static eth+STA, hotspot, hidden SSID, \
regdomain country/bands. Bootstrap installs \
`/etc/sudoers.d/evo-network-nm` for nmcli+iw+rfkill.
"""

[[racks.shelves]]
name = "shares"
shape = 1
description = """
Network file-share management surface. Multi-occupant \
respondent shelf co-stocked by two plugins with disjoint \
verb sets: the share-management + discovery half \
(network.share.add / edit / remove / mount / unmount / \
list_configured / get_state + network.discovery.refresh / \
list) and the SMB-server half (network.smb_server.apply / \
user_add / user_revoke / get_state). Framework's admission \
gate refuses overlapping stockings; dispatch-time \
verb-aware routing lands each verb on its declaring \
plugin. Both plugins publish reactive subjects the \
operator UI consumes for read-then-subscribe: \
system_network_shares_configured / _discovered / \
network_share_state (per share) / network_share_events / \
system_smb_server. \
Distributions shipping local-storage-only can omit either \
or both plugins; the shelf declaration remains so the \
UI's subject-subscribe path resolves.
"""

[[racks]]
name = "metadata"
family = "domain"
kinds = ["registrar"]
charter = """
Track / album / artist metadata resolution surface. Each \
provider answers `metadata.query` with v1 JSON for an \
addressed target (mpd-path, mpd-album). Local reference \
provider reads embedded tags via lofty; future providers \
(online services, vendor catalogues) attach to the same \
shelf without changing the consumer contract.
"""

[[racks.shelves]]
name = "providers"
shape = 1
description = """
Metadata respondent: answers `metadata.query` for an \
addressed target (scheme + value). Reference implementation \
reads embedded tags from local audio files via lofty; \
supports `standard` and `extended` response profiles. \
Consumer-facing schema lives in evo-catalogue-schemas \
(metadata query v1).
"""

[[racks]]
name = "artwork"
family = "domain"
kinds = ["registrar"]
charter = """
Cover-art and visual-material resolution surface. Each \
provider answers `artwork.resolve` with binary payload and \
metadata for an addressed target. Local reference provider \
resolves embedded picture frames + sidecar files from the \
operator's library; future providers (online services, \
vendor caches) attach to the same shelf without changing \
the consumer contract.
"""

[[racks.shelves]]
name = "providers"
shape = 1
description = """
Artwork respondent: answers `artwork.resolve` for an \
addressed target (scheme + value). Reference implementation \
resolves embedded ID3 / FLAC picture frames and sidecar \
folder.jpg / cover.jpg / front.jpg files from the operator's \
library. Consumer-facing schema lives in evo-catalogue-schemas \
(artwork resolve v1).
"""

[[racks]]
name = "system"
family = "domain"
kinds = ["registrar"]
charter = """
Host-level system management surface. One shelf per \
system concern; the power shelf carries operator-gestured \
reboot / power-off verbs gated by the framework's per-verb \
capability gate at step_up:system_admin. Additional shelves \
(time, storage, updates) attach as their plugins land.
"""

[[racks.shelves]]
name = "power"
shape = 1
description = """
Host power-management respondent: answers `reboot_device` and \
`power_off_device` for the operator's gestured shutdown \
requests. Both verbs are step_up gated at the framework \
dispatcher (scope `system_admin`); the principal must hold the \
write scope AND an active step-up auth session before the verb \
reaches the plugin. Reference implementation invokes \
`systemctl reboot|poweroff` through a narrow EVO_SYSTEM_POWER \
sudoers grant; vendor distributions that need different \
shutdown semantics (hardware watchdog, alternate init system) \
ship a vendor-namespace replacement under the same verb shape.
"""

[[racks.shelves]]
name = "kiosk"
shape = 1
description = """
On-device kiosk operator-settings respondent: answers \
`set_display_rotation`, `set_touch_calibration`, and \
`launch_touch_calibration` for the operator who needs to \
align the physical display + touchscreen from either the \
on-glass UI or a paired remote browser. All three verbs are \
write-gated at the framework dispatcher (scope `system_admin`, \
no step-up — a step-up card on a mis-calibrated glass would \
be un-tappable, defeating the recovery path this shelf \
exists for). Reference implementation is the \
`org.evoframework.system.kiosk` plugin, which writes plain \
text overlay files under `/var/lib/evo/settings/kiosk/`. The \
same overlay files are also written from within the \
on-device kiosk-browser via WebKit script-message handlers; \
the shared `evo-kiosk-config` crate is the single source of \
truth for the write bytes + wizard math so remote and \
on-glass paths never drift. Kiosk-side apply machinery \
(inotify watcher on the compositor session + systemd \
`evo-kiosk-touch-calibrate.path` for the touch overlays) \
picks up the writes and re-runs `wlr-randr --transform` / \
regenerates the LIBINPUT_CALIBRATION_MATRIX udev rule. \
Vendor distributions that ship an alternate kiosk stack \
replace the plugin under their vendor namespace; the verb \
names + capability scope are stable across vendor \
replacements, as is the on-disk overlay contract.
"""

[[racks.shelves]]
name = "notifications"
shape = 1
description = """
Operator-visible notifications respondent: answers \
`list_active` / `set_base_mode` / `set_quiet_hours` / `send` / \
`cancel` for the operator's notifications tray and any plugin \
that programmatically emits a notification. Reference \
implementation is the `org.evoframework.system.notifications` \
plugin, which owns the in-memory NotificationDispatcher (active \
list + operator-configured base mode + quiet-hours policy + \
group-coalescing) and republishes the `system_notifications_active` \
singleton subject on every send / cancel / mode-change / \
auto-dismiss transition. Notifications are ephemeral by charter \
(no persistence — restart drops the active list; recurring \
conditions re-emit, transient conditions are gone). Vendor \
distributions that need a different notification back-end \
(desktop-environment integration, mobile push, siren) ship a \
vendor-namespace replacement under the same verb shape. Mode + \
quiet-hours verbs are step-up-gated against `system_admin`; \
list_active / send / cancel are anonymous — send-time \
attribution comes from the payload's `source_plugin` field.
"""

# Subject types the audio playback warden announces on
# every song change. The track subject is keyed by
# `mpd-path` URI scheme; the album subject is keyed by
# `mpd-album` and carries `"{artist}|{album}"` value form.
[[subjects]]
name = "track"

[[subjects]]
name = "album"

# Subject type the playback warden announces at load and
# updates on every audio-format change (track transition
# with different rate, gapless transition into a different-
# rate track, MPD reopen at a different format). Carries
# the AudioFormat reaching the DAC (after resampling +
# DoP wrapping) and, when separately knowable, the source
# AudioFormat MPD decoded from the file. Operator UI
# subscribes to this subject to render the live format
# display (sample rate, bit depth, channel count, DSD +
# DoP transport flag). Canonical addressing:
# `evo.audio.playback:stream_format`. Schema reference:
# `schemas/org.evoframework/audio/playback.v1.toml`
# acceptance criterion
# `stream-format-published-on-load-and-every-format-change`.
[[subjects]]
name = "audio_playback_stream_format"

# Subject type the audio terminus plugin announces at load
# and updates at 30 Hz (tier-adaptive) while audio flows
# through the post-mixer tap. Payload carries v1-shape
# magnitudes (256 mel-scale bins stereo Float32 [0, 1]),
# peak_hold (perceptually decayed per bin), per-band onset
# booleans (sub_bass / bass / mid / high), L/R correlation
# per bin, and at_ms timestamp. Operator UI subscribes via
# subscribe_happenings filtering for this subject_type to
# render the live visualiser without polling. The terminus
# is leader-authoritative for multi-room: only the leader's
# terminus emits the subject; followers inherit via
# subscription. Canonical addressing:
# `evo.audio.playback:spectrum_frame`. Schema reference:
# `schemas/org.evoframework/audio/playback.v1.toml`
# acceptance criterion `spectrum-payload-v1-shape`.
[[subjects]]
name = "audio_playback_spectrum_frame"

# Subject type the playback warden announces at load and
# updates on every playback state transition (play, pause,
# stop, track change, seek, set_volume, set_mute, set_repeat,
# set_shuffle, set_single, set_consume) plus on every
# regular status poll so `elapsed_ms` advances live for
# subscribers. Payload carries transport_state,
# track (title/artist/album/mpd_path), elapsed_ms,
# duration_ms, volume, muted, repeat, shuffle, single,
# consume. Operator UI subscribes to this subject to render
# the live now-playing centre stage (current track, progress
# bar, transport state, volume readout) without poll.
# Canonical addressing: `evo.audio.playback:now_playing`.
# Schema reference:
# `schemas/org.evoframework/audio/playback.v1.toml`
# acceptance criterion
# `now-playing-published-on-load-and-every-state-transition`.
[[subjects]]
name = "audio_playback_now_playing"

# Disposition audit trail published by the playback warden.
# Carries the typed record (kind, optional run, recovery hint)
# of every autonomous device decision (a track skipped because
# its source was offline, a queue exhausted with no playable
# items, etc.). The audit trail is the operator's window into
# decisions the device made without an explicit gesture; the
# UI surfaces it as a recent-activity panel with per-entry
# recovery hints.
[[subjects]]
name = "audio_playback_disposition"

# Operator-facing queue projection on the audio.queue.v1
# shelf. Carries the current MPD queue with per-item
# `available` semantics derived from the per-source state +
# the song's `evo:available` MPD sticker. Truncated to a
# bounded window (queue head) for subject-wire size; the full
# queue stays addressable via `queue.get_queue` for
# long-running operator inspection.
[[subjects]]
name = "audio_queue"

# Operator-facing stored-playlist index projection on the
# audio.playlist.v1 shelf. Carries the list of stored
# playlists with per-item summaries (name, item count, last
# modified). The favourites reserved internal playlist is
# excluded from the index — favourites have their own
# subject.
[[subjects]]
name = "audio_playlist_index"

# Operator-facing favourites projection on the
# audio.favourites.v1 shelf. Carries the membership of the
# reserved internal favourites playlist as an ordered list
# of URIs; the framework's subject-state subscribers serve
# membership queries from this snapshot without a per-query
# MPD round-trip.
[[subjects]]
name = "audio_favourites"

# Operator-facing library source listing on the
# audio.library.v1 shelf. Carries every registered source
# (local-internal floor + operator-attached USB / NAS /
# cloud) with its kind, mount path, current state, scan
# policy, and track count. Subscribers render the source
# list in the operator UI; state transitions republish.
[[subjects]]
name = "audio_library_sources"

# Operator-facing per-source state-machine projection on the
# audio.library.v1 shelf. Carries the current state
# (Probing / Online / Degraded / Offline / Retired) for each
# registered source with the last-known transition timestamp
# and the reason string when present. Distinct from
# `audio_library_sources` (which carries the full source
# record set) because the state changes more frequently than
# the source set.
[[subjects]]
name = "audio_library_state"

# Operator-facing library scan progress projection on the
# audio.library.v1 shelf. Carries the per-source scan
# progress when an eager-incremental scan is in flight
# (items found, items scanned, current path). Stays present
# at idle with the last completed scan's summary so the UI
# surfaces "last scanned N items at HH:MM" between scans.
[[subjects]]
name = "audio_library_scan_progress"

# Subject type the playback.options plugin announces as a
# durable projection of the operator's audiophile-grade
# settings (resampling / mixer_type / dop / output_device /
# volume_normalization). Other plugins (playback.mpd's
# mixer-mode reactor, future UI plugins) subscribe to this
# subject's state changes via the framework's
# SubjectStateSubscriber to react to operator updates
# without restarting the steward. The plugin uses
# `evo.audio.options:settings` as the canonical addressing.
[[subjects]]
name = "audio_options_settings"

# Subject types carried by the mixer-mode transition's
# envelope-coordination protocol. The orchestrator
# (playback.options-shape plugin) publishes
# `envelope_requested` to engage / release the safety
# envelope on each transition step (pre-mute at step 2;
# unmute at step 7). The playback warden (playback.mpd-shape
# plugin) subscribes to `envelope_requested`, transitions
# its playback chain (Pause / Resume), and publishes
# `envelope_observed` with the matching generation. The
# orchestrator awaits the matching observation within a
# bounded timeout; timeout routes to the rollback chain.
# Schema reference: `schemas/org.evoframework/audio/
# options.v2.toml` acceptance criterion
# `mixer-transition-envelope-coordination`.
[[subjects]]
name = "audio_mixer_transition_envelope_requested"

[[subjects]]
name = "audio_mixer_transition_envelope_observed"

# Subject type the network plugin announces as the read-able
# surface for the device's connectivity verdict. Consumers
# (UI, online-metadata plugins, share-mount controllers,
# operator wire-ops) resolve the canonical id by querying
# the subject querier with addressing
# `evo.networking.link:connectivity` and subscribe to state
# changes via the framework's SubjectStateSubscriber. The
# field set mirrors the schema declaration in the
# catalogue-schemas repo under
# `schemas/org.evoframework/networking/link.v1.toml`.
[[subjects]]
name = "network_connectivity_state"

# Subject type the multi-room source-host plugin announces
# per group whose source-host role is admitted on the local
# node. Carries a rolling-window of per-frame audible-time
# trace records bracketing the in-code stages of the
# audio path between source-host's frame capture and
# receiver's `writei` return. The source-host aggregates
# each receiver's back-report (over the audio-plane
# control channel) into combined records keyed by
# `(sequence, receiver_device_id)`. The schema's
# canonical declaration lives in `evo-catalogue-schemas`
# under `schemas/org.evoframework/audio/multiroom.v1.toml`.
# Operators read the current snapshot via the wire-op
# `audio.multiroom.frame_trace.snapshot` for multi-room
# verification evidence; the subject is also subscribable
# for live render in operator UI.
[[subjects]]
name = "audio_multiroom_frame_trace"

# Subject type the multi-room plugin announces per
# device-or-group entity it cares for. The envelope carries
# the unified rendering shape for the multi-room UI card
# surface (state-to-visual mapping per transport state +
# unified shape across solo / group / subgroup / master
# cases); UI cards subscribe once per entity and receive
# every transition reactively through the framework's
# subject-state subscription substrate. The schema's
# canonical declaration lives in `evo-catalogue-schemas`
# under `schemas/org.evoframework/audio/multiroom.v1.toml`;
# the public design source-of-truth covering state-to-visual
# mapping, list/tile geometry, theme placeholder rules, and
# breadcrumb composition lives in `evo-ui-eng/docs/
# CARD-DESIGN-SOURCE.md`.
[[subjects]]
name = "audio_multiroom_device_card"

# Singleton-per-node subject the multi-room plugin
# announces at load with the local node's current
# effective role (source / receiver / auto), updating on
# every `engage_role` transition. Consumers on the same
# node (audio.terminus's leader-of-active-group gate,
# future post-mixer plugins) subscribe to fixed addressing
# `(evo.audio.multiroom.local_role, local)` and gate
# behaviour on the role without having to acquire the
# local device id through the `audio_plane` capability.
# The schema's canonical declaration lives in
# `evo-catalogue-schemas` under `schemas/org.evoframework/
# audio/multiroom.v1.toml`.
[[subjects]]
name = "audio_multiroom_local_role"

# Subject type the delivery.alsa plugin announces at load
# carrying the resolved-outputs list (one entry per ALSA
# card / subdevice the host kernel exposes). The plugin
# joins each `aplay -l` row against its shipped card-name
# catalog and the hardware.audio-config plugin's active
# DAC, attaching an operator-friendly label, an output
# class hint, and the default mixer control. Operator UI
# resolves the canonical id by querying the subject
# querier with addressing `evo.audio.delivery:outputs` and
# subscribes to state changes via the framework's
# SubjectStateSubscriber to react when the host's audio
# topology changes. The field set mirrors the schema
# declaration in the catalogue-schemas repo under
# `schemas/org.evoframework/audio/delivery.v2.toml`.
[[subjects]]
name = "audio_delivery_outputs"

# Subject types the hardware.audio-config plugin announces
# at admission. capabilities carries the resolved DAC class
# list + per-class instances + per-instance mixer-type
# capability (the destination-picker capability surface).
# active_config carries the currently-selected DAC + its
# bound ALSA coordinate. pending_reboot is True when a
# select_dac / register_overlay / remove_overlay gesture
# rewrote the boot-config dtoverlay block and a reboot is
# required for the change to take effect. dsp_capabilities
# carries the three-layer-resolved DSP control set for the
# active DAC. modder_overlays carries the registered user
# overlay set (DTBO blobs registered via the modder
