# Framework-tier subject types published by the reference
# plugins that stock the framework-tier shelves. Each plugin
# registers its own subject types via its LoadContext.subject_announcer
# handle at load. The catalogue lists them here so the
# announcer's per-boot subject-type validation gate does not
# refuse the announcement with an `UnknownSubjectType` error,
# which would leave every UI consumer subscribed to a subject
# that never publishes.
#
# Adding a new framework-tier subject type requires adding an
# entry here; the discovery walker does NOT auto-declare types
# from plugin source constants.

# Published by `org.evoframework.system.notifications`:
# `system_notifications_active`. Singleton per node
# (`evo.system.notifications.active` / `local`) carrying the
# operator-facing active-notification tray + base mode +
# quiet-hours state. Republished on every send / cancel /
# mode-change / auto-dismiss transition.
[[subjects]]
name = "system_notifications_active"

# Published by `org.evoframework.network.shares`: singleton
# `system_network_shares_configured` carrying the current set
# of operator-configured SMB / NFS share records. Republished
# on every add_share / edit_share / remove_share.
[[subjects]]
name = "system_network_shares_configured"

# Published by `org.evoframework.network.shares`: singleton
# `system_network_shares_discovered` carrying the discovered
# NAS inventory (mDNS-SD + per-host smbclient sweep).
# Republished on every operator-issued discovery.refresh + on
# the 5-min background cadence.
[[subjects]]
name = "system_network_shares_discovered"

# Published by `org.evoframework.network.shares`: per-share
# `network_share_state`. One instance per configured share
# (addressing value = share_id); carries mount state +
# operator-facing failure reason + negotiated dialect.
# Announced on add_share, retracted on remove_share, updated
# on every mount / unmount transition.
[[subjects]]
name = "network_share_state"

# Published by `org.evoframework.network.shares`: singleton
# `network_share_events` carrying the bounded lifecycle-event
# ring (mount / unmount / mount_failed / unmount_failed).
# Must be declared here — without it, subject-publisher attach
# fails and the publisher slot is never set, so later
# network_share_state transitions are not republished.
[[subjects]]
name = "network_share_events"

# Published by `org.evoframework.network.smb-server`:
# singleton `system_smb_server` carrying evo-as-SMB-server
# enabled state + min_protocol + extra_shares + smb_users
# list (no credential_key on the wire). Republished on every
# apply / user_add / user_revoke.
[[subjects]]
name = "system_smb_server"

# Relation predicates between the audio domain's subject
# types. The audio playback warden asserts album_of from
# the playing track to its album on every song change;
# library / UI views consume the inverse tracks_of to
# enumerate album contents.
[[relation]]
predicate = "album_of"
description = "track belongs to album"
source_type = "track"
target_type = "album"
source_cardinality = "at_most_one"
target_cardinality = "many"
inverse = "tracks_of"

[[relation]]
predicate = "tracks_of"
description = "album contains tracks"
source_type = "album"
target_type = "track"
source_cardinality = "many"
target_cardinality = "at_most_one"
inverse = "album_of"
