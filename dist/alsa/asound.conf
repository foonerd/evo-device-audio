# Modular ALSA pipeline definition for evo-device-audio.
# Installed at `/etc/asound.conf` by the distribution's
# bootstrap script. ALSA reads `/etc/asound.conf` (system-wide)
# at every PCM open; no include glob needed — this is the
# canonical place for the system's audio pipeline definition.
# Vendor distributions that prefer to layer on top of a stock
# distro's asound.conf instead manage the merge in their own
# bootstrap.
#
# `pcm.evo` is the single entry point every audio-producing
# plugin in the evo-device-audio distribution writes to. MPD's
# `audio_output { device "evo" }` resolves here; future
# pipeline stages (resampler, EQ, room correction, peppyalsa
# visualisation, etc.) get inserted into this chain without
# touching MPD's config or any plugin code.
#
# The chain shape is intentionally minimal in this build:
#
#   evo → plug → hw:CARD=@EVO_AUDIO_CARD@,DEV=0
#
# `plug` is ALSA's automatic format-conversion plugin — it
# negotiates between the format MPD decoded the source to
# (typically 44.1kHz/16bit/2ch for MP3) and the format the
# hardware accepts. Without it, MPD's direct write to
# `hw:CARD=...,DEV=0` returns ENOTSUPP whenever the hardware's
# active format doesn't match the source. With it, MP3, FLAC,
# WAV, and DSD-over-PCM all play through the same pipeline.
#
# `hw:CARD=...,DEV=0` uses the kernel-stable card NAME rather
# than the numeric index (`hw:2,0`). Card indices reorder
# across reboots when USB DACs are hot-plugged; using the name
# keeps the pipeline pinned to the same hardware regardless of
# probe order.
#
# Per-target hardware: the bootstrap script substitutes
# `@EVO_AUDIO_CARD@` with the operator's actual ALSA card name
# at install time. Detection is via `aplay -l` (first playback
# card present); operators with multiple cards can override via
# `bootstrap.sh --card <NAME>`. Reference DAC for the audio
# distribution is the I-Sabre Q2M (card name `DAC`); other
# hardware substitutes its own.
#
# Pipeline-stage insertion (composition layer): each pipeline
# stage (resampler, soxr, EQ, room correction, peppyalsa)
# gets its own asound drop-in at
# /etc/asound.d/NN-evo-<stage>.conf (NN < 99 so it loads
# before this file) defining `pcm.evo_<stage>`, and `pcm.evo`
# then chains through them. The delivery.alsa plugin owns the
# stage-chain composition logic; this file is the trailing
# terminus that always delivers to hardware.

pcm.evo {
    type plug
    slave.pcm "evo_dac"
    hint {
        show on
        description "evo-device-audio modular ALSA pipeline"
    }
}

# Audio-terminus tap and audio-output fan-out: the tap is now
# an MPD-level concern, not an ALSA-level workaround. MPD writes
# TWO audio_output blocks: one targeting `pcm.evo` (the
# listening output, where the operator-chosen mixer_type applies)
# and one targeting `pcm.evo_terminus_tap` (the terminus
# output, mixer_type "none" so the tap always captures source
# audio at full scale regardless of operator volume).
#
# Why MPD-level fan-out instead of an ALSA multi-slave tee here:
# the tee captures whatever MPD writes. When MPD's mixer_type
# is "software", MPD attenuates samples BEFORE writing — the
# tap then sees post-fader audio and the visualiser's
# magnitudes scale with operator volume. Splitting at MPD's
# output stage keeps each output independently mixer-typed:
# the listening output attenuates per the operator's mixer
# choice; the terminus output runs mixer_type "none" so the
# tap always sees source audio. This makes the tap pre-fader
# on EVERY rig class — hardware-mixer DAC, software-mixer USB
# DAC, Bluetooth output, multi-room receiver — without any
# per-rig conditional in the asound chain.
#
# Floor invariant: MPD's audio_output blocks are independent.
# If the Loopback subdevice fails (snd-aloop unloaded, kernel
# error), MPD's listening output stays up and the DAC keeps
# rendering. Terminus output failure does NOT disrupt local
# audio.
pcm.evo_dac {
    type hw
    card "@EVO_AUDIO_CARD@"
    device 0
}

pcm.evo_terminus_tap {
    type hw
    card "Loopback"
    device 0
    subdevice 7
}

ctl.evo {
    type hw
    card "@EVO_AUDIO_CARD@"
}

# Runtime drop-in composition. ALSA's `last definition wins`
# semantics let pipeline stages compose on top of the base
# definitions above without touching this file. Drop-ins live
# under /etc/asound.d/ and are included below by explicit
# path; the bootstrap pre-creates each as an empty placeholder
# so the includes never fail to parse. ALSA's include syntax
# does not support globs portably across the versions evo
# targets — explicit paths are the reliable shape.
#
# Each producer atomic-overwrites its drop-in to switch state.
# Truncating the file back to empty (rather than removing it)
# collapses its effect on pcm.evo while keeping the include
# resolvable. The playback.mpd plugin's supervisor watches
# /etc/asound.d/ for mtime changes and cycles MPD output 0
# (disableoutput + enableoutput on the MPD wire protocol) so
# MPD reopens its snd_pcm_t against the post-change
# composition without a systemd bounce.
#
# Drop-in producers, in load order (later wins on conflicts):
#
#   1. /etc/asound.d/evo-options.conf — operator-tunable
#      surface written by the org.evoframework.delivery.alsa
#      plugin on every gesture against the playback.options
#      surface (rate, mixer, terminus).
#
#   2. /etc/asound.d/zz-evo-multiroom-source.conf — multi-room
#      source-mode loopback bridge, written by the
#      org.evoframework.multiroom.evo-native plugin while a
#      live multi-room group is engaged in source mode. The
#      drop-in redefines pcm.evo to route through snd-aloop's
#      playback half and defines pcm.evo_local as a direct
#      alias to the local DAC. Truncated to empty when the
#      role transitions out of engaged source, restoring the
#      direct path defined above on the next PCM open.
#
# Future pipeline stages (resampler, EQ, room correction,
# peppyalsa visualisation) take their own entry below as the
# stage lands.
</etc/asound.d/evo-options.conf>
</etc/asound.d/zz-evo-multiroom-source.conf>
