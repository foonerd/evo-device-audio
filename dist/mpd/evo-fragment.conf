# MPD audio_output fragment for evo-device-audio.
#
# Drop this file at `/etc/evo/mpd.conf` and add
# `include_optional /etc/evo/mpd.conf` to `/etc/mpd.conf`
# so MPD picks up the framework-curated audio_output block.
#
# Modular-ALSA pipeline binding: MPD writes to `pcm.evo` — the
# single entry point defined in `/etc/asound.conf` (shipped by
# this distribution's bootstrap). The pipeline terminates at
# the operator's chosen DAC via the kernel-stable
# `hw:CARD=...,DEV=0` form. Format negotiation, future
# resampler / EQ / room-correction / peppyalsa stages all get
# inserted into the asound chain at the asound layer — MPD's
# config stays unchanged. MPD does not own ALSA-specific
# knowledge; the asound chain owns the audio pipeline
# composition.
#
# This fragment is the boot-time form (used before the audio
# data plane reconciliation engine publishes a topology). The
# substrate-aware shape (playback.mpd's F3 fragment writer)
# rewrites this file dynamically from the framework's
# negotiated WriteEndpoint per topology and reloads MPD on
# every route change. Until the framework publishes a
# topology, this static fragment carries the modular ALSA
# pipeline entry point so MPD has a valid audio_output at boot.
#
# music_directory is set in the main `/etc/mpd.conf` (not
# here) — pointing at `/var/lib/evo/music/` per the
# distribution's bring-up procedure.

audio_output {
    type            "alsa"
    name            "evo-device-audio"
    device          "evo"
    mixer_type      "software"
}

# Local Unix-domain control socket. The audio reference
# warden's `emit_test_tone` course-correct verb opens a
# dedicated MPD connection on this socket to dispatch the
# `add file://...` + `play` sequence — MPD's security model
# refuses `file://...` URI loads over TCP, but allows them on
# the local Unix socket. Without this binding, the verb
# refuses with a structured Permanent error pointing at the
# missing surface. The supervisor's main connection stays on
# its configured TCP / Unix endpoint; this socket is only
# used by the side-channel test-tone path.
#
# MPD treats `bind_to_address` directives additively (the
# main /etc/mpd.conf already binds localhost / any TCP); this
# include layers the Unix socket alongside without disturbing
# TCP.
bind_to_address "/run/mpd/socket"

# Boot-time playback state.
#
# MPD's shipped default is `restore_paused "no"` — on start it
# reads its persistent state file and, if a track was Playing
# at shutdown, IMMEDIATELY tries to auto-resume that URI.
# That is fine for local URIs (files under `music_directory`
# resolve without the network), but it is a stall class for
# any URI whose resolution needs the network — DLNA identity
# URIs (`dlna:<svc>/<obj>`), remote MPD stream URIs
# (`http(s)://…`), or a network-share file whose mount point
# has not been re-hydrated yet. When such a resume fires
# before `network-online.target` reports connectivity, MPD
# blocks on the unresolvable URI and the entire track-
# completion log goes silent for the duration of the stall
# (observed rig behaviour: 2 h+ hole after a DLNA-source
# reboot with the interface still coming up).
#
# `restore_paused "yes"` boots the device Paused with the
# current-song URI restored. The operator's Play gesture is
# the trigger — for a local URI it starts immediately; for a
# remote URI it fails cleanly with an audible error rather
# than an invisible multi-hour stall.
restore_paused "yes"
